<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Colosseum & Ludus</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#170c08;color:#302016;font-family:Georgia,'Times New Roman',serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible{outline:3px solid #ffc857;outline-offset:3px}button:disabled{opacity:.5;cursor:default}#viewport{position:fixed;inset:0;overflow:hidden}#game{position:absolute;width:1536px;height:864px;transform-origin:0 0;display:grid;grid-template-columns:158px 1fr;grid-template-rows:54px 810px;background:#4b1710}aside.sidebar{grid-row:1/3;background:linear-gradient(90deg,#360a07,#6a2018 55%,#3d0d09);border-right:3px solid #bc8c43;color:#f5deb0;z-index:5}.crest{height:85px;display:grid;place-items:center;font-size:44px;color:#e9c477;border-bottom:1px solid #b78c49}nav button{display:flex;align-items:center;gap:10px;width:100%;height:60px;padding:0 13px;border:0;border-bottom:1px solid #a675414f;background:none;color:inherit;text-align:left;font-size:16px}nav button.active{background:linear-gradient(100deg,#f4d593,#fff4d3,#ddb571);color:#302014;box-shadow:inset 0 0 0 2px #d4ad6b}nav svg{width:26px;height:26px;flex:none}.sidebar small{display:block;text-align:center;margin-top:30px;color:#c8a367;font-size:12px}header{background:linear-gradient(90deg,#611710,#220a07);border-bottom:2px solid #c7a061;display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:#ffe2a0}header strong{font-size:29px;font-weight:normal}.resources{display:flex;gap:28px;align-items:center;font-size:20px}.resources i{font-style:normal;color:#f5c453}.resources .diamond{color:#59d9ff}.resources .sapphire{color:#337cff}.resources .ruby{color:#c864e8}#page{position:relative;overflow:hidden;background-size:cover;background-position:center}.content{position:absolute;inset:24px 30px;display:flex;flex-direction:column;gap:18px}.title{align-self:center;margin:0;padding:9px 52px;background:linear-gradient(#852820,#4a100c);border:2px solid #edcd85;box-shadow:0 0 0 3px #663c21;color:#ffe9b4;font-size:32px;font-weight:normal}.panel{border:2px solid #aa793c;box-shadow:0 0 0 2px #edce93,0 6px 18px #24100766;background:linear-gradient(115deg,#fff9eeeF,#efe0c6f5);padding:19px;border-radius:5px;min-width:0}.panel h2{font-size:25px;margin:0 0 16px;font-weight:normal;border-bottom:1px solid #b99c6d;padding-bottom:10px}.btn{border:2px solid #d9b46d;box-shadow:0 0 0 1px #69401e;background:linear-gradient(#85271e,#4e100c);color:#fff0c5;padding:11px 20px;text-align:center}.btn:hover{filter:brightness(1.17)}.btn.dark{background:linear-gradient(#453126,#1c130c)}.btn.light{background:#f3e5cb;color:#392317}.row{display:flex;align-items:center;gap:14px}.spread{justify-content:space-between}.grid{display:grid;gap:18px;min-height:0}.stat{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #cab591;padding:11px 0;font-size:18px}.green{color:#347039}.muted{color:#79634b}.small{font-size:15px}.tabs{display:flex;gap:6px;margin-bottom:15px}.tabs button{flex:1;padding:10px 8px;border:1px solid #b09362;background:#f4ead8;color:#3a271b}.tabs button.active{background:#732219;color:#fff0ce}.art{width:100%;height:146px;background:#511712;display:grid;place-items:center;border:1px solid #aa8550}.art svg{width:85%;height:90%;filter:drop-shadow(2px 6px 4px #0007)}.item{position:relative;border:2px solid #b0905c;background:#fff7e8;padding:8px;color:#2d1c11;min-width:0;text-align:center}.item.active{outline:3px solid #e7b54d;box-shadow:0 0 15px #e6b74d}.item .art{background:radial-gradient(ellipse,#ead7b6,#ccb18b);height:145px}.item b{display:block;font-size:18px;margin-top:7px}.item em{position:absolute;right:12px;top:12px;background:#51331b;color:#fff1c7;padding:3px 7px;font-style:normal}.stones{padding:12px;background:#dce7f4;border:1px solid #8ca4c6;color:#25466f;margin-top:14px;line-height:1.7}.stones.purple{background:#eee0ed;border-color:#b99aba;color:#693065}.progress{height:22px;border:2px solid #886431;background:#49301c;margin:14px 0}.progress i{display:block;height:100%;background:linear-gradient(#ffe08c,#ba8128)}.hotspot{position:absolute;display:flex;gap:12px;align-items:center;font-size:19px}.hotspot svg{width:25px;height:25px}.status{position:absolute;right:22px;top:22px;width:225px}.status p{font-size:18px;margin:22px 0}.portrait{height:195px;background:url('gladiators-courtyard.png') center 35%/cover}.roster{position:absolute;bottom:25px;left:40px;width:980px;padding:15px;display:flex;gap:13px}.roster button{flex:1}.roster .portrait{height:95px}.right{position:absolute;right:25px;top:25px;bottom:25px;width:285px}.right .btn{width:100%;margin-top:12px}.training-options{position:absolute;left:50px;top:40px;width:940px;display:flex;gap:25px}.training-options .btn{flex:1;height:105px;font-size:21px}.quest-card{padding:14px;display:flex;flex-direction:column;gap:15px}.quest-card h3{margin:0;text-align:center;padding:12px;color:#fff5d7;background:#56704c;font-size:22px}.quest-card:nth-child(2) h3{background:#916226}.quest-card:nth-child(3) h3{background:#782d26}.quest-card p{line-height:1.5;font-size:19px;margin:0}.quest-visual{height:165px;background:url('market-courtyard.png') center/cover}.quest-card:nth-child(2) .quest-visual{background-image:linear-gradient(#092c5866,#12132388),url('missions-courtyard.png')}.quest-card:nth-child(3) .quest-visual{background-image:linear-gradient(#b8491933,#71310e44),url('arena-colosseum.png')}.forge{width:220px;height:220px;border:15px double #d0a250;border-radius:50%;background:radial-gradient(#882d23,#400c0b);color:#ffe5aa;font-size:68px;display:grid;place-items:center;margin:20px auto}.market-row{display:grid;grid-template-columns:1.4fr 1fr 1.5fr 1fr;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #cdb795;width:100%;background:transparent;color:#302016;text-align:left;border-top:0;border-left:0;border-right:0;font-size:17px}.market-row.active{background:#efd69e}.market-row.heading{background:#3d2b1d;color:#fff0ce}.mode{padding:0;overflow:hidden;text-align:center}.mode .picture{height:260px;background:url('arena-colosseum.png') center/cover}.mode h2{border:0;padding:0;margin:18px 0 6px}.mode p{margin:10px}.mode .btn{margin:22px 12px;width:calc(100% - 24px)}.member{padding:14px 0;border-bottom:1px solid #cab591;display:flex;justify-content:space-between}.war{padding:18px;color:#fff1d1;background:linear-gradient(#50151250,#240a08d9),url('arena-colosseum.png') center/cover;text-align:center;min-height:275px}.war .btn{margin-top:25px}.deco{height:140px;background-size:cover;background-position:center;border:2px solid #bb975d}.chat-contact{width:100%;padding:17px 10px;text-align:left;border:0;border-bottom:1px solid #cab591;background:transparent;font-size:19px;color:#3a2419}.chat-contact.active{background:#f1d89e}.chat-contact small{display:block;margin-top:6px}.thread{height:390px;overflow:auto;overscroll-behavior:contain}.bubble{background:#fffaf1;border:1px solid #c9b08a;border-radius:6px;padding:13px;margin:15px 0;max-width:85%;line-height:1.5}.bubble.mine{margin-left:auto;background:#f2deb6}input,select{border:1px solid #b69a70;background:#fff8ec;padding:11px;min-width:0;color:#392617}#modal{position:absolute;inset:0;z-index:20;background:#150b08aa;display:none;align-items:center;justify-content:center}#modal.open{display:flex}.dialog{width:590px;max-height:740px;overflow:auto}.dialog .btn{margin-top:15px}.notice{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#321b12;color:#fff0c9;border:1px solid #d6ad65;padding:14px 24px;z-index:30;pointer-events:none}#rotate{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;color:#ffe1a1;background:#2d100c;font-size:22px;padding:30px}@media(orientation:portrait){#rotate{display:flex}#viewport{visibility:hidden}}
</style></head><body><div id="viewport"><div id="game"><aside class="sidebar"><div class="crest">❧</div><nav id="nav"></nav><small>MVP • Yerel demo<br>v4 — 24.09.2026</small></aside><header><strong>Colosseum &amp; Ludus</strong><div class="resources" id="resources"></div></header><main id="page"></main><div id="modal" role="dialog" aria-modal="true"></div></div></div><div id="rotate">Telefonunu yatay çevir.<br>Oyun ekranı bütünüyle sığacak şekilde açılır.</div>
<script>
'use strict';
const $=s=>document.querySelector(s), game=$('#game'), page=$('#page');
const routes=[['home','Ana Sayfa','home-courtyard'],['gladiators','Gladyatörler','gladiators-courtyard'],['training','Antrenman','training-yard'],['quests','Görevler','missions-courtyard'],['inventory','Envanter','inventory-armory'],['upgrades','Geliştirmeler','upgrade-forge'],['market','Pazar','market-courtyard'],['arena','Arena','arena-colosseum'],['guild','Guild','guild-courtyard'],['ludus','Ludus','ludus-management'],['messages','Mesajlar','messages-courtyard']];
const names=['Cassius Nero','Aurus','Varro','Titus','Felix','Drusus'];
const gear=[['LUDUS',5,'İki Elli Kılıç'],['Aquila Gladius',3,'Kılıç'],['Retiarius Mızrağı',0,'Mızrak'],['Secutor Balta',1,'Balta'],['Murmillo Kılıcı',4,'Kılıç'],['Arena Hançeri',1,'Hançer'],['Thracian Kılıcı',2,'Kılıç'],['Net & Trident',2,'Trident']];
let state={gold:12500,diamond:320,fighter:0,item:0,training:'Kılıç Talimi',category:'Silah',quest:null,messages:[],read:false},current='home';
try{Object.assign(state,JSON.parse(localStorage.getItem('ludus-v4')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('ludus-v4',JSON.stringify(state))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fit(){const v=window.visualViewport,w=v?v.width:innerWidth,h=v?v.height:innerHeight,s=Math.min(w/1536,h/864);game.style.transform=`scale(${s})`;game.style.left=`${(w-1536*s)/2+(v?v.offsetLeft:0)}px`;game.style.top=`${(h-864*s)/2+(v?v.offsetTop:0)}px`}
addEventListener('resize',fit);if(visualViewport){visualViewport.addEventListener('resize',fit);visualViewport.addEventListener('scroll',fit)}fit();
function icon(id){let paths={home:'M3 12 12 3 21 12M5 10v11h5v-7h4v7h5V10',gladiators:'M5 20v-8a7 7 0 0 1 14 0v8h-5v-7H9v7zM8 3l4-2 4 2',training:'M2 8v8m4-11v14m0-7h12m0-7v14m4-11v8',quests:'M5 3h14v18H5zM8 7h8M8 11h8M8 15h5',inventory:'M3 8h18v12H3zM7 8V4h10v4M3 12h18m-11 0v4h2v-4',upgrades:'M3 8h18l-5 5h-4v5h5v3H5v-3h4v-5L3 10z',market:'M12 2v19M5 21h14M3 6h18M5 6 1 15h8L5 6m14 0-4 9h8l-4-9',arena:'M3 21V8q9-10 18 0v13M3 10h18M3 15h18M7 6v15m5-17v17m5-15v15',guild:'M8 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6m8 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6M2 21v-5q6-7 12 0v5m1-8q7-2 7 5v3',ludus:'M2 8 12 2 22 8zM3 21h18M5 9v10m5-10v10m4-10v10m5-10v10',messages:'M2 5h20v15H2zM2 5l10 8L22 5'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">${`<path d="${paths[id]||paths.inventory}"/>`}</svg>`}
function weapon(i=0){let shape=i===3?'<path d="M96 30Q40 20 42 86L95 68z" fill="#b6bbc0"/>':i===2||i===7?'<path d="M80 10 62 60h36z" fill="#ccd6dc"/>':'<path d="M80 8 57 117 80 136 103 117z" fill="url(#steel)"/><path d="M80 8v126" stroke="#eff5f7"/>';return `<svg viewBox="0 0 160 210"><defs><linearGradient id="steel"><stop stop-color="#697986"/><stop offset=".5" stop-color="#f4f5e9"/><stop offset="1" stop-color="#7a8690"/></linearGradient></defs><g transform="rotate(32 80 105)"><path d="M76 55h8v141h-8z" fill="#603823"/>${shape}<path d="M49 134h62v8H49z" fill="#c3974b"/><path d="M74 144h12v43H74z" fill="#593623"/><circle cx="80" cy="190" r="9" fill="#b38b42"/></g></svg>`}
function btn(text,action,kind=''){return `<button class="btn ${kind}" data-action="${action}">${text}</button>`}
function stat(a,b){return `<div class="stat"><span>${a}</span><b>${b}</b></div>`}
function shell(title,html){return `<div class="content"><h1 class="title">${title}</h1>${html}</div>`}
function stones(){return `<div class="stones"><b>Basılı Safir Etkileri (4/4)</b><br>Extra HP +12% · Kritik +8%<br>Block Rate +6% · FORTUNA +74%</div><div class="stones purple"><b>Basılı Yakut Etkileri (2/2)</b><br>MARS +5% · VICTORIA +4%</div>`}
function detail(){let g=gear[state.item];return `<h2>${g[0]} +${g[1]}</h2><div class="art">${weapon(state.item)}</div><p>${g[2]} · Marcus Varro</p>${stat('Physical Attack','2690 ~ 3088')}${stat('Physical Defense','248 / 255')}${stat('Critical','17')}${stat('Block Rate','100')}${stones()}`}
function itemCards(count=8){return gear.slice(0,count).map((g,i)=>`<button class="item ${state.item===i?'active':''}" data-action="item:${i}"><div class="art">${weapon(i)}</div><em>+${g[1]}</em><b>${g[0]}</b><span>${g[2]}</span></button>`).join('')}
function tabs(list,active,prefix){return `<div class="tabs">${list.map(x=>`<button class="${x===active?'active':''}" data-action="${prefix}:${x}">${x}</button>`).join('')}</div>`}
function roster(){return `<div class="roster panel">${names.map((n,i)=>`<button class="item ${i===state.fighter?'active':''}" data-action="fighter:${i}"><div class="portrait" style="background-position:${10+i*16}% center"></div><b>${n}</b></button>`).join('')}</div>`}
const render={
home:()=>{let positions=[[17,14],[47,40],[45,64],[69,81],[6,40],[7,79],[86,45],[69,28],[46,23],[17,14],[84,75]];return routes.slice(1).map((r,i)=>{let p=positions[i+1];return `<button class="btn dark hotspot" style="left:${p[0]}%;top:${p[1]}%" data-action="go:${r[0]}">${icon(r[0])}${r[1]} ›</button>`}).join('')+`<div class="panel status"><h2>Bugünün Durumu</h2><p>3 görev hazır</p><p>2 gladyatör boşta</p><p>1 geliştirme uygun</p><p>${state.messages.length+1} yeni mesaj</p></div>`},
gladiators:()=>`<div class="panel right"><div class="portrait"></div><h2 style="margin-top:12px">${names[state.fighter]}</h2><p>Seviye 12 · Murmillo</p>${stat('Overall','76')}${stat('Stat Gücü','+12%')}${stat('Skill Etkisi','+7%')}${stat('Yorgunluk','18%')}${stat('Durum','Hazır')}${btn('Detay','profile')}${btn('Göreve Gönder','go:quests')}${btn('Antrenmana Al','go:training','dark')}</div>${roster()}`,
training:()=>`<div class="training-options">${['Kılıç Talimi','Savunma Talimi','Dayanıklılık','Çeviklik'].map(x=>btn(x,'train:'+x,x===state.training?'':'light')).join('')}</div><div class="panel right"><div class="portrait"></div><h2>Antrenman</h2><p>Günlük Çalışma Planı</p>${stat('Gladyatör',names[state.fighter])}${stat('Çalışma',state.training)}${stat('Süre','2s 30dk')}${stat('Stat Gelişimi','+%1.2')}${stat('Yorgunluk','+%8')}${btn('Antrenmanı Başlat','start-training')}${btn('Gladyatör Değiştir','go:gladiators','dark')}<p class="small">Boş kalan gladyatör gün sonunda rastgele bir statta %1 kaybedebilir.</p></div>${roster()}`,
quests:()=>shell('Caesar’dan Mühürlü Görevler',`<div class="grid" style="grid-template-columns:1fr 250px;margin-left:260px;margin-top:95px"><div class="grid" style="grid-template-columns:repeat(3,1fr)">${['Basit Görev','Tehlikeli Görev','Gizli Görev'].map((n,i)=>`<article class="panel quest-card"><h3>${n}</h3><div class="quest-visual"></div><p>${["Ostia Limanı’nda kaçak mal deposunu bas.",'Kilikya kıyısında korsan sığınağına gece baskını.','Suriye sınırında düşman erzak hattına sabotaj.'][i]}</p>${stat('Süre',['3s','8s','16s'][i])}<p>Risk: ${['Düşük','Orta','Yüksek'][i]}</p>${btn('Görevlendir','quest:'+i,'dark')}</article>`).join('')}</div><aside class="panel"><h2>Bugünkü Haklar</h2>${stat('Görev','3')}${stat('Boşta','2')}${stat('Tamamlanan','1')}<p>Göreve giden gladyatör günlük antrenman EXP’sini alır.</p><p class="green">${state.quest?'Aktif: '+esc(state.quest):'Görev seçebilirsin.'}</p></aside></div>`),
inventory:()=>shell('Envanter',`<div class="grid" style="grid-template-columns:1fr 310px"><section class="panel">${tabs(['Silah','Kalkan','Başlık','Zırh','Kolluk','Bacaklık','Taşlar'],state.category,'category')}<div class="grid" style="grid-template-columns:repeat(4,1fr)">${state.category==='Silah'?itemCards():`<div style="grid-column:1/-1;padding:95px;text-align:center"><h2>${state.category}</h2><p>Bu demo envanterinde bu kategoride ekipman yok.</p>${btn('Silahlara dön','category:Silah')}</div>`}</div></section><aside class="panel">${detail()}</aside></div>`),
upgrades:()=>shell('Geliştirmeler',`<div class="grid" style="grid-template-columns:310px 1fr 375px"><aside class="panel">${detail()}</aside><section class="panel" style="text-align:center"><h2>Ekipmanı daha güçlü hale getir</h2><div class="forge">+${gear[state.item][1]}</div>${stat('Sonraki seviye','+'+(gear[state.item][1]+1))}${stat('Başarı oranı',gear[state.item][1]>=5?'80%':'100%')}${stat('Elmas Taşı',state.diamond+' / 1')}${btn('Geliştirmeyi Önizle','enhance')}<p>+5 sonrası her denemede %20 yok olma riski vardır.</p><p class="small muted">Bu sürümde önizleme yapılır; eşya silinmez.</p></section><section class="panel"><h2>İtem Envanteri</h2><div class="grid" style="grid-template-columns:repeat(3,1fr)">${itemCards(6)}</div></section></div>`),
market:()=>shell('Pazar',`<div class="grid" style="grid-template-columns:1fr 300px"><section class="panel"><div class="row"><input id="search" placeholder="İtem veya gladyatör ara…" style="flex:1"><select id="sort"><option value="asc">En Düşük Fiyat</option><option value="desc">En Yüksek Fiyat</option></select></div><div class="market-row heading" style="margin-top:16px"><span>İtem</span><span>Model</span><span>Taş Etkileri</span><span>Fiyat</span></div><div id="listings"></div><h2 style="margin-top:20px">Benim İlanlarım</h2><p>Henüz aktif ilanın yok.</p>${btn('Yeni İlan Oluştur','listing')}</section><aside class="panel">${detail()}${btn('Satın Alma Önizlemesi','purchase')}</aside></div>`),
arena:()=>shell('ARENA',`<div class="grid" style="grid-template-columns:repeat(4,1fr) 255px;margin-top:60px">${['Ranked Arena','Imperial Solo','Haftalık Solo','Haftalık Takım'].map((x,i)=>`<article class="panel mode"><div class="picture" style="background-position:${i*30}% center"></div><h2>${x}</h2><p>${['5v5 takım savaşı','20 kişi / büyük arena','10 kişi / herkes herkese','4 takım × 5 kişi'][i]}</p><p>${i===0?'Rating 1500 · Sezon Başlangıç':' '}</p>${i<2?btn('Arena’ya Gir','arena:'+i):'<button class="btn light" disabled>Yakında</button>'}</article>`).join('')}<aside class="panel"><h2>Arena Durumu</h2><div class="forge" style="width:160px;height:160px;font-size:40px">III</div>${stat('Derece','Bronz III')}${stat('Rating','1500')}${stat('Galibiyet','0')}${stat('Mağlubiyet','0')}<h3>Rozetler</h3><p style="font-size:35px;color:#af8c50">❧ ❧ ❧</p></aside></div>`),
guild:()=>shell('Guild',`<section class="panel row spread"><div><h2>Aquila Ludus</h2><p>Guild Seviyesi 12 · Üye: 24 / 30 · Guild Gücü: 184,250</p></div><div>${btn('Guild Daveti','invite')}${btn('Üye Yönetimi','members','light')}</div><div><h2>Guild Şeref Salonu</h2><p>02/2027 Kupa Galibi · 06/2027 Lig Şampiyonu</p></div></section><div class="grid" style="grid-template-columns:1fr 1.3fr 1fr"><section class="panel"><h2>Üyeler</h2>${['Ludus Aurum','Ferrum Ludus','Roma Victor','Sol Invictus'].map((x,i)=>`<div class="member"><span>${x}<br>Güç: ${8940-i*730}</span><span class="green">${i===2?'Arena':'Online'}</span></div>`).join('')}${btn('Tüm Üyeler','members','light')}</section><section class="panel"><h2>Guild War</h2><div class="grid" style="grid-template-columns:1fr 1fr"><div class="war"><h2>20v20 Lig Savaşı</h2><p>Haftalık eşleşme</p><p>Katılım: 14 / 20</p>${btn('Kadroyu Gör','war')}</div><div class="war"><h2>20v80 Kupa</h2><p>4 birlik, tek kazanan</p><p>Başvuru açık</p>${btn('Kupayı Gör','cup')}</div></div></section><section class="panel"><h2>Guild Sıralaması</h2>${['Imperium Maxima','Aquila Ludus','Ferrum Pactum','Capua Wolves','Nova Roma'].map((x,i)=>stat((i+1)+'. '+x,1245-i*165)).join('')}</section></div><section class="panel"><h2>Son Guild Olayları</h2>Ludus Aurum pazardan LUDUS +5 aldı. &nbsp; • &nbsp; Savaş kadrosu güncellendi. &nbsp; • &nbsp; Haftalık görev tamamlandı.</section>`),
ludus:()=>shell('Ludus Yönetimi',`<section class="panel" style="margin-left:180px;margin-top:90px"><div class="grid" style="grid-template-columns:1fr 1fr 1fr"><div><h2>Dominus</h2><div class="portrait" style="height:130px;background-image:url('ludus-management.png');background-position:left center"></div><p>Marcus Aelius · Ludus Ustası · Seviye 12</p></div><div><h2>Ludus Seviyesi</h2><p>Ludus EXP 7,450 / 10,000</p><div class="progress"><i style="width:74.5%"></i></div>${stat('Genel Verim','+12%')}${stat('Günlük Aktiflik','8 / 10')}</div><div><h2>Şampiyonluklar</h2><p style="font-size:45px;color:#a9813e">❧ &nbsp; ❧ &nbsp; +7</p><p>02/2027 Kupa Galibi<br>06/2027 Lig Şampiyonu</p></div></div><h2>Ludus Dekorları</h2><div class="grid" style="grid-template-columns:repeat(3,1fr)">${['Mermer Kartal','Kırmızı Sancak','Altın Bronz Lamba'].map((x,i)=>`<div><div class="deco" style="background-image:url('ludus-management.png');background-position:${i*50}% center"></div><p>${x}</p></div>`).join('')}</div><div class="row">${btn('Ludus Detayı','ludus-detail')}${btn('Dekorları Düzenle','decor')}${btn('Dominus Profili','profile')}</div></section>`),
messages:()=>shell('Mesajlar',`<div class="grid" style="grid-template-columns:300px 1fr 305px"><section class="panel"><h2>Konuşmalar</h2>${tabs(['Özel','Guild','Global'],'Özel','chat')} ${['Lucius','Marcus','Varro','Cassia','Titus'].map((x,i)=>`<button class="chat-contact ${i===0?'active':''}" data-action="contact:${x}">${x}<small>${i===0?'Pazarda kılıcı gördün mü?':'Bugünkü görev için hazırım.'}</small></button>`).join('')}</section><section class="panel"><h2 id="chat-title">Lucius — Özel sohbet</h2><div class="thread" id="thread"><div class="bubble">Pazarda kılıcı gördün mü?</div><div class="bubble mine">Evet, fiyatı biraz yüksek geldi.</div><div class="bubble">Taşları iyi, FORTUNA %74.</div>${state.messages.map(x=>`<div class="bubble mine">${esc(x)}</div>`).join('')}</div><form id="send" class="row"><input name="message" required maxlength="400" placeholder="Mesaj yaz…" style="flex:1"><button class="btn">Gönder</button></form><p class="small muted">Yerel demo — mesajlar başka oyunculara gönderilmez.</p></section><section class="panel"><h2>Sistem Bildirimleri</h2>${state.read?'<p>Tüm bildirimler okundu.</p>':['Görev tamamlandı: Ostia Limanı','İtem satıldı: Gladius +4','Gladyatör boşta: Felix','Geliştirme uygun: LUDUS +5','Yeni guild duyurusu var'].map(x=>`<div class="member">${x}</div>`).join('')}${btn('Okundu İşaretle','read')}</section></div>`)
};
function show(id){if(!render[id])id='home';current=id;page.style.backgroundImage=`url('${routes.find(r=>r[0]===id)[2]}.png')`;page.innerHTML=render[id]();$('#resources').innerHTML=`<span><i>◉</i> ${state.gold.toLocaleString('tr-TR')}</span><span><i class="diamond">◆</i> ${state.diamond}</span><span><i class="sapphire">◆</i> 18</span><span><i class="ruby">◆</i> 25</span>`;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.action==='go:'+id));if(id==='market')listings();save()}
function listings(){let q=$('#search').value.toLocaleLowerCase('tr'),sort=$('#sort').value;let rows=Array.from({length:10},(_,i)=>({i:i%8,price:210000+i*85000})).filter(r=>gear[r.i][0].toLocaleLowerCase('tr').includes(q)).sort((a,b)=>sort==='asc'?a.price-b.price:b.price-a.price);$('#listings').innerHTML=rows.map(r=>`<button class="market-row ${r.i===state.item?'active':''}" data-action="item:${r.i}"><b>${gear[r.i][0]} +${gear[r.i][1]}</b><span>${gear[r.i][2]}</span><span>HP +12% · MARS +5%</span><b>${r.price.toLocaleString('tr-TR')}</b></button>`).join('')||'<p>İlan bulunamadı.</p>'}
function modal(title,body){$('#modal').innerHTML=`<section class="panel dialog"><h2>${title}</h2>${body}<div>${btn('Kapat','close','light')}</div></section>`;$('#modal').classList.add('open');$('#modal button')?.focus()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let [a,...rest]=b.dataset.action.split(':'),v=rest.join(':');if(a==='go')show(v);else if(a==='close')$('#modal').classList.remove('open');else if(a==='fighter'){state.fighter=+v;show(current)}else if(a==='item'){state.item=+v;show(current)}else if(a==='category'){state.category=v;show(current)}else if(a==='train'){state.training=v;show(current)}else if(a==='read'){state.read=true;show(current)}else if(a==='quest'){modal('Gladyatör Görevlendir',`<p>${names[state.fighter]} seçili.</p><p>Görev: ${['Ostia Limanı','Kilikya Baskını','Suriye Sınırı'][+v]}</p>${btn('Yerel Demoda Başlat','confirm-quest:'+v)}`)}else if(a==='confirm-quest'){state.quest=['Ostia Limanı','Kilikya Baskını','Suriye Sınırı'][+v];$('#modal').classList.remove('open');show('quests')}else if(a==='start-training')modal('Antrenman Planı',`<p>${names[state.fighter]} — ${state.training}</p><p>2 saat 30 dakika · Stat +%1.2 · Yorgunluk +%8</p><p>Plan önizlemesi. Sunucu zamanlayıcısı henüz bağlı değil.</p>`);else if(a==='contact'||a==='chat'){$('#chat-title').textContent=v+' — Yerel sohbet'}else if(a==='arena')modal(v==='0'?'Ranked Arena — 5v5':'Imperial Solo — 20 kişi',`<p>Seçili gladyatör: ${names[state.fighter]}</p><p>Hazırlık ekranı önizlemesi. Çevrimiçi eşleştirme bu sürüme bağlı değil.</p>${btn('Gladyatörleri Gör','go:gladiators')}`);else {let text={profile:['Dominus Profili','Marcus Aelius · Ludus Ustası · Seviye 12'],enhance:['Geliştirme Önizlemesi',gear[state.item][0]+' +'+gear[state.item][1]+' → +'+(gear[state.item][1]+1)+'. Elmas maliyeti: 1. İşlem henüz uygulanmaz.'],purchase:['Satın Alma Önizlemesi','Seçili eşya: '+gear[state.item][0]+'. Gerçek ödeme veya eşya transferi yapılmaz.'],listing:['Yeni İlan','İlan oluşturma formu bir sonraki işlev aşamasında bağlanacak.'],invite:['Guild Daveti','Davetler için oyuncu hesapları ve sunucu bağlantısı gerekli.'],members:['Guild Üyeleri','24 / 30 üye. Ludus Aurum, Ferrum Ludus, Roma Victor, Sol Invictus.'],war:['Guild War — Lig','20v20 · Katılım 14 / 20. Kadro kilidi yalnızca savaş başlatıldığında uygulanır.'],cup:['Guild War — Kupa','4 birlik × 20 gladyatör. Kupa başvurusu önizlemesi.'],decor:['Ludus Dekorları','Mermer Kartal, Kırmızı Sancak, Altın Bronz Lamba.'], 'ludus-detail':['Ludus Detayı','Seviye 12 · EXP 7,450 / 10,000 · Genel Verim +12%']}[a];if(text)modal(text[0],'<p>'+esc(text[1])+'</p>')}});
document.addEventListener('input',e=>{if(e.target.id==='search')listings()});document.addEventListener('change',e=>{if(e.target.id==='sort')listings()});document.addEventListener('submit',e=>{if(e.target.id!=='send')return;e.preventDefault();let text=new FormData(e.target).get('message').trim();if(!text)return;state.messages.push(text);show('messages');$('#thread').scrollTop=$('#thread').scrollHeight});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('open')});
document.addEventListener('click',e=>{if(e.target.closest('[data-action^="go:"]'))$('#modal').classList.remove('open')});
$('#nav').innerHTML=routes.map(r=>`<button data-action="go:${r[0]}">${icon(r[0])}<span>${r[1]}</span></button>`).join('');show('home');
</script>
<style>.play-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.play-card{padding:20px}.play-card p{line-height:1.5}.play-card .btn{margin-top:12px}.play-banner{background:#31190edc;color:#ffe4af;padding:12px 20px;border:1px solid #ceac67}.play-log{height:430px;overflow:auto;overscroll-behavior:contain}.play-log p{padding:10px;border-bottom:1px solid #b89964}.play-fighter{height:205px;background:url('gladiators-courtyard.png') center/cover}.play-summary{display:flex;gap:16px}.play-summary>div{flex:1}.empty-art{height:180px;display:grid;place-items:center;background:linear-gradient(135deg,#40140f,#a06b39);color:#e9c477}.empty-art svg{width:95px;height:95px}.pill{display:inline-block;background:#4d321d;color:#f8e4b9;padding:5px 10px;margin-right:8px}.play-card.selected{outline:3px solid #e8bc5c}.play-card .art{height:180px}#save-warning{position:absolute;bottom:0;left:158px;right:0;background:#922e20;color:white;z-index:40;text-align:center;padding:12px}
</style><script>
// V5: offline, single-player game engine. No remote accounts or real-money trade.
const SAVE_KEY='colosseum-play-v5';
const initialGame=()=>({version:5,gold:12500,diamonds:12,sapphires:4,rubies:2,xp:0,rating:1500,wins:0,losses:0,selected:0,selectedItem:0,seq:0,job:null,lastBattle:0,log:['Ludus’un açıldı. İlk görevin seni bekliyor.'],fighters:[{name:'Cassius Nero',power:76,fatigue:0},{name:'Aurus',power:68,fatigue:0},{name:'Varro',power:71,fatigue:0}],items:[{id:1,name:'LUDUS',level:0,kind:0,blue:0,purple:0},{id:2,name:'Aquila Gladius',level:0,kind:1,blue:0,purple:0}],offers:[{id:101,name:'Murmillo Kılıcı',level:2,kind:4,price:2400},{id:102,name:'Secutor Balta',level:1,kind:3,price:1800},{id:103,name:'Retiarius Mızrağı',level:3,kind:2,price:3900}],bought:[],decor:0,report:null});
let play=initialGame(),saveBroken=false;
try{const saved=localStorage.getItem(SAVE_KEY);if(saved){play=validateSave(JSON.parse(saved))}}catch(e){saveBroken=true}
function persist(next){try{localStorage.setItem(SAVE_KEY,JSON.stringify(next));return true}catch(e){return false}}
function transact(fn){if(saveBroken){modal('Kayıt kullanılamıyor','<p>Tarayıcı kaydına erişilemedi. İlerlemenin kaybolmaması için işlemler durduruldu. Tarayıcı depolama izinlerini kontrol et.</p>');return false}const next=JSON.parse(JSON.stringify(play));let err=fn(next);if(err){modal('İşlem yapılamadı','<p>'+esc(err)+'</p>');return false}next.seq++;if(!persist(next)){saveBroken=true;modal('Kayıt yapılamadı','<p>İşlem uygulanmadı. Depolama alanını veya tarayıcı izinlerini kontrol et.</p>');return false}play=next;return true}
function record(p,text){p.log.unshift(text);p.log=p.log.slice(0,40)}
function selected(p=play){return p.fighters[p.selected]}
function equipped(p=play){return p.items.find(x=>x.id===p.selectedItem)||p.items[0]}
function busy(p=play){return p.job&&p.job.fighter===p.selected}
function level(){return Math.min(50,1+Math.floor(play.xp/500))}
function remaining(t){let s=Math.max(0,Math.ceil((t-Date.now())/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function art(kind){return `<div class="empty-art">${icon(kind)}</div>`}
function statusJob(){return play.job?`<span class="pill">${esc(play.job.label)} — ${play.fighters[play.job.fighter].name}</span><span data-timer="${play.job.end}">${remaining(play.job.end)}</span> ${btn('Sonucu Al','p:claim')}`:'Aktif çalışma yok.'}
function hud(){ $('#resources').innerHTML=`<span><i>◉</i> ${play.gold.toLocaleString('tr-TR')}</span><span><i class="diamond">◆</i> ${play.diamonds}</span><span><i class="sapphire">◆</i> ${play.sapphires}</span><span><i class="ruby">◆</i> ${play.rubies}</span>`;$('.sidebar small').innerHTML='V5 • Tek oyunculu<br>Otomatik yerel kayıt';}
const oldShow=show;
show=function(id){oldShow(id);hud()};
render.home=()=>shell('Ludus’una Hoş Geldin',`<div class="play-banner">Seviye ${level()} · ${play.xp} EXP · ${play.wins} galibiyet · ${play.losses} mağlubiyet</div><div class="play-summary" style="margin-top:380px"><div class="panel"><h2>İlk Adım</h2><p>Görev yap, altın ve taş kazan. Ekipmanını güçlendir, arenada rakibini yen.</p>${btn('Görev Seç','go:quests')}</div><div class="panel"><h2>Devam Eden İş</h2><p>${statusJob()}</p></div><div class="panel"><h2>Son Haber</h2><p>${esc(play.log[0])}</p>${btn('Ludus Defteri','go:messages','dark')}</div></div>`);
render.gladiators=()=>shell('Gladyatörler',`<div class="play-banner">Başlangıç kadron: 3 gladyatör. Seçili: ${selected().name}. Yeni gladyatör: 4.000 altın.</div><div class="play-grid">${play.fighters.map((f,i)=>`<article class="panel play-card ${i===play.selected?'selected':''}"><div class="play-fighter" style="background-position:${i*30}% center"></div><h2>${f.name}</h2>${stat('Güç',f.power.toFixed(1))}${stat('Yorgunluk',f.fatigue+'%')}${stat('Durum',play.job?.fighter===i?'Çalışıyor':'Hazır')}${btn('Seç','p:fighter:'+i,'dark')}${btn('Dinlendir (100 altın)','p:rest:'+i)}</article>`).join('')}</div>${play.fighters.length<6?btn('Gladyatör İşe Al — 4.000 altın','p:recruit'):''}`);
render.quests=()=>shell('Mühürlü Görevler',`<div class="play-banner">Seçili: ${selected().name} · İlk sürüm için hızlandırılmış görev süreleri. ${statusJob()}</div><div class="play-grid" style="margin-left:220px;margin-top:70px">${['Ostia Limanı','Kilikya Baskını','Suriye Sınırı'].map((x,i)=>`<article class="panel play-card"><div class="quest-visual" style="filter:${i===1?'brightness(.6)':'none'}"></div><h2>${x}</h2><p>${['Kaçak mal deposunu bul ve muhafızları etkisiz hale getir.','Korsanların ikmal noktasına gece baskını düzenle.','Sınırdaki düşman erzak hattını kes.'][i]}</p>${stat('Süre',[30,60,90][i]+' saniye')}${stat('Altın',[450,850,1400][i])}${stat('EXP',[100,180,280][i])}${stat('Elmas',i+1)}${btn('Görevi Başlat','p:quest:'+i)}</article>`).join('')}</div>`);
render.training=()=>shell('Antrenman',`<div class="play-banner">${selected().name} · Güç ${selected().power.toFixed(1)} · ${statusJob()}</div><div class="play-grid" style="margin-top:230px">${['Kılıç Talimi','Savunma Talimi','Dayanıklılık'].map((x,i)=>`<section class="panel play-card"><h2>${x}</h2><p>45 saniye çalışma · +${i+1} güç · +${8+i*4}% yorgunluk</p><p>Maliyet: ${(i+1)*100} altın</p>${btn('Antrenmanı Başlat','p:training:'+i)}</section>`).join('')}</div>`);
render.inventory=()=>shell('Envanter',`<div class="play-banner">${play.items.length} ekipman · Kartı seçerek arenada kullan. Her eşyaya 4 Safir ve 2 Yakut uygulanabilir.</div><div class="grid" style="grid-template-columns:1fr 330px"><section class="panel play-grid" style="max-height:620px;overflow:auto">${play.items.map(x=>`<button class="item ${equipped()?.id===x.id?'active':''}" data-action="p:item:${x.id}"><div class="art">${weapon(x.kind)}</div><b>${x.name} +${x.level}</b><p>Safir ${x.blue}/4 · Yakut ${x.purple}/2</p></button>`).join('')||'<p>Envanter boş. Pazardan ekipman alabilirsin.</p>'}</section><aside class="panel"><h2>Seçili Ekipman</h2><p>${equipped()?equipped().name+' +'+equipped().level:'Yok'}</p>${stat('Safir etkisi', '+'+(equipped()?.blue||0)*3+'% güç')}${stat('Yakut etkisi','+'+(equipped()?.purple||0)*4+'% güç')}${btn('Geliştirmeye Git','go:upgrades')}${btn('Pazarı Aç','go:market','dark')}</aside></div>`);
render.upgrades=()=>{let x=equipped();return shell('Ekipman Geliştirme',x?`<div class="grid" style="grid-template-columns:350px 1fr 350px"><section class="panel"><h2>${x.name} +${x.level}</h2><div class="art" style="height:270px">${weapon(x.kind)}</div><p>Her + seviye arenada %3 ekipman gücü kazandırır.</p>${stat('Safir',x.blue+'/4')}${stat('Yakut',x.purple+'/2')}</section><section class="panel" style="text-align:center"><h2>Elmas ile Güçlendir</h2><div class="forge">+${x.level}</div>${stat('Başarı',x.level<5?'100%':'80%')}${stat('Bedel','1 Elmas')}${btn('Geliştir','p:upgrade-confirm')}<p>${x.level>=5?'Dikkat: Başarısızlıkta eşya tamamen yok olur.':' +1 ile +5 arasındaki geliştirmeler güvenlidir.'}</p></section><aside class="panel"><h2>Taş İşleme</h2><div class="stones">Safir: Her taş +%3 güç. En fazla 4.</div>${btn('Safir Bas — 1 Safir','p:stone:blue')}<div class="stones purple">Yakut: Her taş +%4 güç. En fazla 2.</div>${btn('Yakut Bas — 1 Yakut','p:stone:purple')}<p class="muted">Tek oyunculu ilk sürüm: taş etkileri arena gücüne uygulanır.</p></aside></div>`:`<div class="panel"><h2>Ekipmanın yok</h2>${btn('Pazara Git','go:market')}</div>`)};
render.market=()=>shell('Pazar — NPC Tüccarı',`<div class="play-banner">Gerçek oyuncu pazarı değil. Alımlar yerel kaydına işlenir; her ilan bir kez satın alınabilir.</div><div class="play-grid">${play.offers.filter(x=>!play.bought.includes(x.id)).map(x=>`<article class="panel play-card"><div class="art">${weapon(x.kind)}</div><h2>${x.name} +${x.level}</h2><p>Safir 0/4 · Yakut 0/2</p>${stat('Fiyat',x.price.toLocaleString('tr-TR')+' altın')}${btn('Satın Al','p:buy-confirm:'+x.id)}</article>`).join('')||'<section class="panel">Tüm teklifler satın alındı.</section>'}</div><section class="panel"><h2>Geliştirme Malzemeleri</h2><div class="row">${btn('1 Elmas — 300 altın','p:supply:diamonds')}${btn('1 Safir — 450 altın','p:supply:sapphires')}${btn('1 Yakut — 700 altın','p:supply:rubies')}</div></section>`);
render.arena=()=>shell('ARENA',`<div class="play-banner">Bilgisayar rakiplerine karşı hesaplamalı savaş. Canlı oyuncu eşleştirmesi yok.</div><div class="grid" style="grid-template-columns:1fr 1fr 320px;margin-top:120px"><article class="panel mode"><div class="picture"></div><h2>Takım Arenası — 5v5</h2><p>Eksik takım üyelerini NPC müttefikler tamamlar.</p><p>Giriş: 100 altın · Zafer: 400 altın, 120 EXP</p>${btn('Takımı Hazırla','p:battle-confirm:team')}</article><article class="panel mode"><div class="picture" style="background-position:right"></div><h2>Imperial Solo — 20 Kişi</h2><p>19 bilgisayar rakibi arasında sıralamanı gör.</p><p>Giriş: 100 altın · İlk 3: 700 altın, 180 EXP</p>${btn('Savaşa Hazırlan','p:battle-confirm:solo')}</article><aside class="panel"><h2>Arena Durumu</h2>${stat('Rating',play.rating)}${stat('Galibiyet',play.wins)}${stat('Mağlubiyet',play.losses)}${stat('Seçili',selected().name)}${stat('Yorgunluk',selected().fatigue+'%')}${btn('Son Savaş Raporu','p:report','dark')}</aside></div>`);
render.guild=()=>shell('Guild',`<section class="panel" style="margin:160px auto;width:760px;text-align:center"><h2>Çevrimiçi Guild Sistemi</h2><p>Bu sürüm tek oyunculudur. Guild üyeliği, davetler ve 20v20 savaşlar sunucu aşamasında açılacak.</p><p>Uydurma oyuncu listesi veya çalışmayan başvuru butonu gösterilmez.</p>${art('guild')}${btn('Arena’ya Git','go:arena')}</section>`);
render.ludus=()=>shell('Ludus Yönetimi',`<section class="panel" style="margin:130px 20px 0 230px"><h2>Marcus Aelius’un Ludus’u</h2><div class="play-grid"><div>${stat('Seviye',level())}${stat('EXP',play.xp)}<div class="progress"><i style="width:${play.xp%500/5}%"></i></div></div><div>${stat('Gladyatör',play.fighters.length)}${stat('Ekipman',play.items.length)}</div><div>${stat('Galibiyet',play.wins)}${stat('Dekor seviyesi',play.decor)}</div></div><h2>Ludus Dekorları</h2><p>Dekor geliştirmesi görev altın ödüllerine seviye başına %5 bonus verir. En fazla 3 seviye.</p>${btn('Dekoru Geliştir — 1.500 altın','p:decor')}<h2 style="margin-top:25px">Kayıt Güvenliği</h2><p>İlerleme bu tarayıcıda saklanır. Tarayıcı verilerini silmeden önce yedeğini indir.</p>${btn('Kayıt Yedeğini İndir','p:export','dark')}<label class="btn light" style="display:inline-block">Yedek Yükle<input id="import-save" type="file" accept="application/json" style="display:none"></label></section>`);
render.messages=()=>shell('Ludus Defteri',`<div class="grid" style="grid-template-columns:1fr 340px"><section class="panel"><h2>Olaylar ve Ödüller</h2><div class="play-log">${play.log.map(x=>'<p>'+esc(x)+'</p>').join('')}</div></section><aside class="panel"><h2>Mesajlar</h2><p>Çevrimiçi özel, guild ve global sohbet sunucu aşamasında açılacak.</p><p>Burada görev, geliştirme ve savaş sonuçlarını takip edebilirsin.</p>${statusJob()}</aside></div>`);
// A single captured dispatcher prevents old preview buttons from processing game actions.
document.addEventListener('click',e=>{const b=e.target.closest('[data-action^="p:"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();const [,a,v]=b.dataset.action.split(':');handlePlay(a,v)},true);
function handlePlay(a,v){if(a==='export'){const url=URL.createObjectURL(new Blob([JSON.stringify(play,null,2)],{type:'application/json'}));const anchor=document.createElement('a');anchor.href=url;anchor.download='ludus-kayit-v5.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),2000);return}if(a==='report'){return modal('Savaş Raporu',play.report?`<p>${esc(play.report.title)}</p>${play.report.lines.map(x=>'<p>'+esc(x)+'</p>').join('')}`:'<p>Henüz savaş yapılmadı.</p>')}
if(a==='upgrade-confirm'){const x=equipped();if(!x)return;return modal('Geliştirmeyi Onayla',`<p>${x.name} +${x.level} → +${x.level+1}</p><p>1 Elmas harcanır. ${x.level>=5?'%20 olasılıkla eşya ve içindeki taşlar yok olur.':'İşlem güvenlidir.'}</p>${btn('Onayla','p:upgrade:'+x.id)}`)}
if(a==='buy-confirm'){const o=play.offers.find(x=>x.id===+v);if(o)return modal('Satın Alma',`<p>${o.name}: ${o.price} altın.</p>${btn('Onayla','p:buy:'+v)}`);return}
if(a==='battle-confirm')return modal('Savaşa Hazırlık',`<p>${selected().name} · Yorgunluk ${selected().fatigue}%</p><p>100 altın giriş bedeli. Savaş sonunda +15% yorgunluk. Savaşlar arasında 10 saniye beklenir.</p>${btn('Savaşı Başlat','p:battle:'+v)}`);
let ok=transact(p=>{let f=selected(p),x=equipped(p);if(a==='fighter'){if(!p.fighters[+v])return 'Gladyatör yok.';p.selected=+v}
else if(a==='item'){if(!p.items.some(t=>t.id===+v))return 'Eşya yok.';p.selectedItem=+v}
else if(a==='rest'){let f=p.fighters[+v];if(!f)return 'Gladyatör yok.';if(p.job?.fighter===+v)return 'Önce mevcut işi tamamla.';if(!f.fatigue)return 'Gladyatör zaten dinlenmiş.';if(p.gold<100){f.fatigue=Math.max(0,f.fatigue-10);record(p,f.name+' ücretsiz temel dinlenme yaptı: yorgunluk -10%.')}else{p.gold-=100;f.fatigue=Math.max(0,f.fatigue-30);record(p,f.name+' dinlendi: yorgunluk -30%.')}}
else if(a==='recruit'){if(p.fighters.length>=6)return 'Kadro dolu.';if(p.gold<4000)return '4.000 altın gerekli.';p.gold-=4000;p.fighters.push({name:names[p.fighters.length],power:70,fatigue:0});record(p,'Yeni gladyatör kadroya katıldı.')}
else if(a==='quest'||a==='training'){if(p.job)return 'Önce aktif işin sonucunu al.';if(f.fatigue>=80)return 'Gladyatörü önce dinlendir.';let i=+v;if(![0,1,2].includes(i))return 'Geçersiz iş.';let cost=a==='training'?(i+1)*100:0;if(p.gold<cost)return 'Altın yetersiz.';p.gold-=cost;p.job={id:p.seq+1,type:a,tier:i,fighter:p.selected,end:Date.now()+(a==='quest'?[30,60,90][i]:45)*1000,label:a==='quest'?['Ostia Limanı','Kilikya Baskını','Suriye Sınırı'][i]:['Kılıç Talimi','Savunma Talimi','Dayanıklılık'][i]};record(p,f.name+' başladı: '+p.job.label)}
else if(a==='claim'){let j=p.job;if(!j)return 'Alınacak sonuç yok.';if(Date.now()<j.end)return 'İş henüz bitmedi: '+remaining(j.end);let worker=p.fighters[j.fighter];if(j.type==='quest'){let gold=Math.round([450,850,1400][j.tier]*(1+p.decor*.05));p.gold+=gold;p.xp+=[100,180,280][j.tier];p.diamonds+=j.tier+1;p.sapphires+=1;if(j.tier===2)p.rubies+=1;worker.fatigue=Math.min(100,worker.fatigue+10+j.tier*5);record(p,j.label+' tamamlandı: +'+gold+' altın, EXP ve taş ödülleri alındı.')}else{worker.power=Math.min(100,worker.power+j.tier+1);worker.fatigue=Math.min(100,worker.fatigue+8+j.tier*4);p.xp+=50;record(p,worker.name+' antrenmanı tamamladı. Güç +'+(j.tier+1))}p.job=null}
else if(a==='upgrade'){if(!x||x.id!==+v)return 'Eşya değişti, tekrar seç.';if(busy(p))return 'Aktif çalışma sırasında ekipman geliştirilemez.';if(p.diamonds<1)return 'Elmas yetersiz.';p.diamonds--;if(x.level>=5&&Math.random()<.2){p.items=p.items.filter(t=>t.id!==x.id);p.selectedItem=0;record(p,'Geliştirme başarısız: '+x.name+' yok oldu.')}else{x.level++;record(p,x.name+' +'+x.level+' seviyesine geliştirildi.')}}
else if(a==='stone'){if(!x)return 'Ekipman gerekli.';let blue=v==='blue',key=blue?'blue':'purple',currency=blue?'sapphires':'rubies',limit=blue?4:2;if(x[key]>=limit)return 'Taş kapasitesi dolu.';if(p[currency]<1)return 'Taş yetersiz.';p[currency]--;x[key]++;record(p,x.name+' üzerine '+(blue?'Safir':'Yakut')+' işlendi.')}
else if(a==='buy'){let o=p.offers.find(t=>t.id===+v);if(!o||p.bought.includes(o.id))return 'Bu ilan artık yok.';if(p.gold<o.price)return 'Altın yetersiz.';p.gold-=o.price;p.bought.push(o.id);p.items.push({id:o.id,name:o.name,kind:o.kind,level:o.level,blue:0,purple:0});record(p,o.name+' satın alındı.')}
else if(a==='supply'){let costs={diamonds:300,sapphires:450,rubies:700};if(!costs[v])return 'Geçersiz malzeme.';if(p.gold<costs[v])return 'Altın yetersiz.';p.gold-=costs[v];p[v]++}
else if(a==='decor'){if(p.decor>=3)return 'Dekor seviyesi en yüksek değerde.';if(p.gold<1500)return 'Altın yetersiz.';p.gold-=1500;p.decor++;record(p,'Ludus dekor seviyesi '+p.decor+' oldu.')}
else if(a==='battle'){if(busy(p))return 'Gladyatör görevde veya antrenmanda.';if(f.fatigue>=80)return 'Yorgunluk çok yüksek, önce dinlen.';if(p.gold<100)return 'Giriş için 100 altın gerekli.';if(Date.now()-p.lastBattle<10000)return 'Yeni savaş için 10 saniye bekle.';let power=f.power*(1-f.fatigue*.004)*(1+(x?x.level*.03+x.blue*.03+x.purple*.04:0));let opponents=Array.from({length:v==='solo'?19:1},()=>60+Math.random()*50);let score=power*(.85+Math.random()*.3),rank=1+opponents.filter(t=>t>score).length,win=v==='solo'?rank<=3:rank===1;p.gold-=100;p.lastBattle=Date.now();f.fatigue=Math.min(100,f.fatigue+15);if(win){p.wins++;p.gold+=v==='solo'?700:400;p.xp+=v==='solo'?180:120;p.rating+=20}else{p.losses++;p.xp+=35;p.rating=Math.max(0,p.rating-12)}p.report={title:win?'Zafer':'Mağlubiyet',lines:[v==='solo'?'Imperial Solo: '+rank+'/20':'5v5 Takım Arenası — NPC müttefikler ve rakipler',f.name+' etkin güç: '+power.toFixed(1),'Savaş performansı: '+score.toFixed(1),'Rakip güçleri: '+opponents.map(t=>t.toFixed(1)).join(', '),win?'Ödül: '+(v==='solo'?700:400)+' altın ve EXP':'Katılım EXP: 35','Yorgunluk +15% · Rating '+p.rating]};record(p,p.report.title+' — '+(v==='solo'?'Solo sıra '+rank:'Takım Arenası'))}
else return 'Bilinmeyen işlem.';});if(ok){$('#modal').classList.remove('open');show(current);if(a==='battle')handlePlay('report');if(a==='upgrade')modal('Geliştirme Sonucu','<p>'+esc(play.log[0])+'</p>')}}
function validateSave(p){const number=(x,max=1e9)=>Number.isFinite(x)&&x>=0&&x<=max;const label=x=>typeof x==='string'&&x.length<100&&/^[\p{L}\p{N} .’'&+—-]+$/u.test(x);if(!p||p.version!==5)throw Error();for(const k of ['gold','diamonds','sapphires','rubies','xp','rating','wins','losses','seq','lastBattle','selectedItem'])if(!number(p[k],k==='lastBattle'?1e15:1e9))throw Error();if(!Number.isInteger(p.decor)||!number(p.decor,3)||!Array.isArray(p.fighters)||p.fighters.length<1||p.fighters.length>6||p.fighters.some(f=>!label(f.name)||!number(f.power,100)||!number(f.fatigue,100)))throw Error();if(!Number.isInteger(p.selected)||!p.fighters[p.selected]||!Array.isArray(p.items)||p.items.length>100||p.items.some(x=>!label(x.name)||!number(x.id)||!number(x.level,100)||!number(x.kind,7)||!number(x.blue,4)||!number(x.purple,2)))throw Error();if(!Array.isArray(p.offers)||p.offers.length>100||p.offers.some(x=>!label(x.name)||!number(x.id)||!number(x.level,100)||!number(x.kind,7)||!number(x.price)))throw Error();if(!Array.isArray(p.bought)||p.bought.some(x=>!number(x))||!Array.isArray(p.log)||p.log.length>40||p.log.some(x=>typeof x!=='string'||x.length>1000))throw Error();if(p.job&&(!['quest','training'].includes(p.job.type)||!Number.isInteger(p.job.tier)||!number(p.job.tier,2)||!p.fighters[p.job.fighter]||!number(p.job.end,1e15)||!label(p.job.label)))throw Error();if(p.report&&(typeof p.report.title!=='string'||!Array.isArray(p.report.lines)||p.report.lines.some(x=>typeof x!=='string')))throw Error();return p;}
document.addEventListener('change',async e=>{if(e.target.id!=='import-save')return;const file=e.target.files[0];if(!file)return;try{if(file.size>200000)throw Error();const p=validateSave(JSON.parse(await file.text()));if(p.version!==5||!Array.isArray(p.fighters)||p.fighters.length<1||p.fighters.length>6||!Array.isArray(p.items)||!Array.isArray(p.log)||!Array.isArray(p.offers)||!Array.isArray(p.bought)||!Number.isFinite(p.gold)||p.gold<0||!Number.isFinite(p.xp)||!Number.isFinite(p.diamonds)||!Number.isInteger(p.selected)||!p.fighters[p.selected]||p.fighters.some(f=>typeof f.name!=='string'||!Number.isFinite(f.power)||!Number.isFinite(f.fatigue)))throw Error();modal('Yedeği Yükle','<p>Mevcut ilerlemenin üzerine yazılacak. Önce mevcut kaydını indirmen önerilir.</p><button class="btn" id="confirm-import">Yedeği Onayla</button>');$('#confirm-import').onclick=()=>{if(!persist(p)){modal('Hata','<p>Kayıt yazılamadı.</p>');return}play=p;saveBroken=false;$('#modal').classList.remove('open');show('ludus')}}catch(err){modal('Geçersiz Yedek','<p>Geçerli bir V5 kayıt dosyası seç.</p>')}});
setInterval(()=>{document.querySelectorAll('[data-timer]').forEach(el=>el.textContent=Date.now()>=Number(el.dataset.timer)?'Tamamlandı — ödülünü al':remaining(Number(el.dataset.timer)))},1000);
show('home');
</script></body></html>
