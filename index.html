  for(const r of data.slice(page*pageSize,page*pageSize+pageSize)){const row=document.createElement('div');row.className='friend-row';const name=document.createElement('div'),strong=document.createElement('strong'),sub=document.createElement('small');strong.textContent=r.name;sub.textContent='@'+r.username+' · '+(r.state==='accepted'?(r.online?'Çevrimiçi':'Çevrimdışı'):r.incoming?'Sana istek gönderdi':'İstek gönderildi');name.append(strong,sub);row.append(name);if(r.state==='accepted'){const dot=document.createElement('i');dot.className=r.online?'online':'offline';dot.setAttribute('aria-label',r.online?'Çevrimiçi':'Çevrimdışı');row.append(dot);}if(r.state==='pending'&&r.incoming){const b=document.createElement('button');b.textContent='Kabul et';b.onclick=()=>call('accept',null,r.id);b.disabled=busy;row.append(b);}const remove=document.createElement('button');remove.textContent=r.state==='accepted'?'Çıkar':r.incoming?'Reddet':'İptal';remove.disabled=busy;remove.onclick=()=>call('remove',null,r.id);row.append(remove);$('friendList').append(row);}
  if(!data.length){const p=document.createElement('p');p.className='friends-empty';p.textContent=filter==='accepted'?'Kullanıcı adıyla arkadaş ekle. Çevrimiçi arkadaşların burada görünür.':'Bekleyen arkadaşlık isteğin yok.';$('friendList').append(p);}
  const badge=$('friendCount');if(badge)badge.textContent=String(rows.filter(r=>r.state==='accepted'&&r.online).length);
 }
 async function call(action='list',username=null,peer=null){if(!owner){$('friendMessage').textContent='Arkadaşlarını görmek için hesabına giriş yap.';return;}if(busy)return;busy=true;$('friendSend').disabled=true;const seq=++request;
  try{const r=await client.rpc('ludus_social',{p_action:action,p_username:username,p_peer:peer});if(r.error)throw r.error;if(seq!==request)return;rows=r.data.friends||[];if(action==='request'){$('friendUsername').value='';filter='pending';page=0;tabs();}$('friendMessage').textContent=action==='request'?'Arkadaşlık isteği gönderildi.':rows.filter(r=>r.state==='accepted'&&r.online).length+' arkadaş çevrimiçi';}
  catch(e){$('friendMessage').textContent=e.message||'Bağlantı kurulamadı. Tekrar dene.';}finally{busy=false;$('friendSend').disabled=false;render();}
 }
 function tabs(){for(const b of $('friendTabs').children){b.classList.toggle('active',b.dataset.filter===filter);b.setAttribute('aria-pressed',String(b.dataset.filter===filter));}}
 function show(){window.dispatchEvent(new Event('ludus-friends-open'));previous=document.activeElement;layer.hidden=false;open=true;call();$('friendUsername').focus();}
 function close(){window.dispatchEvent(new Event('ludus-friends-close'));layer.hidden=true;open=false;previous?.focus();}
 $('friendsClose').onclick=close;layer.onclick=e=>{if(e.target===layer)close();};$('friendForm').onsubmit=e=>{e.preventDefault();const name=$('friendUsername').value.trim();if(!/^[a-zA-Z0-9_]{3,24}$/.test(name)){$('friendMessage').textContent='3–24 karakterlik kullanıcı adını yaz.';return;}call('request',name);};
 for(const b of $('friendTabs').children)b.onclick=()=>{filter=b.dataset.filter;page=0;tabs();render();};$('friendPrev').onclick=()=>{page--;render();};$('friendNext').onclick=()=>{page++;render();};$('friendsOpen')?.addEventListener('click',show);
 document.addEventListener('keydown',e=>{if(!open)return;if(e.key==='Escape')close();if(e.key==='Tab'){const buttons=[...layer.querySelectorAll('button,input')].filter(x=>!x.disabled&&x.getClientRects().length),first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
 async function heartbeat(){if(!owner||document.hidden)return;if(open){call();return;}try{await client.rpc('ludus_social',{p_action:'ping'});}catch{}}
 client.auth.getUser().then(r=>{if(r.data.user&&!r.data.user.is_anonymous){owner=r.data.user.id;heartbeat();}}).catch(()=>{});setInterval(heartbeat,20000);document.addEventListener('visibilitychange',heartbeat);window.addEventListener('resize',()=>{if(open)render();});render();
})();
