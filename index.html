<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colosseum & Ludus</title><style>
:root{--wine:#631812;--gold:#e1b65c;--ink:#30170c}*{box-sizing:border-box}body{margin:0;min-width:840px;background:#230704;color:var(--ink);font-family:Georgia,serif;overflow-x:auto}.rotate{display:none}.app{display:grid;grid-template-columns:158px 1fr;min-height:100vh}.side{height:100vh;position:sticky;top:0;z-index:7;background:linear-gradient(90deg,#340804,#6f2118 52%,#310805);border-right:2px solid #d9a84b;box-shadow:4px 0 18px #180302;display:flex;flex-direction:column}.crest{height:85px;display:grid;place-items:center;color:#f7db8f;font-size:40px;border-bottom:1px solid #a06431}.crest:before{content:'❧';transform:rotate(180deg)}nav{flex:1;padding-top:2px}.nav{height:61px;width:100%;display:flex;align-items:center;gap:14px;padding:0 14px;border:0;border-bottom:1px solid #8b3e29;background:transparent;color:#f7dfae;font:16px Georgia,serif;text-align:left;cursor:pointer}.nav:hover{background:#812819}.nav.active{color:#32170d;font-weight:bold;background:linear-gradient(90deg,#fff4c6,#e0b65b 64%,#9b3b21);box-shadow:inset 0 0 0 1px #ffe6a0}.ico{width:30px;font-size:24px;text-align:center;color:#e8bd5d}.nav.active .ico{color:#742816}.sidebottom{height:78px;border-top:1px solid #8b3e29;display:grid;place-items:center;color:#e7bf64;font-size:28px}.main{min-width:0}.top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:2px solid #d4a448;background:linear-gradient(90deg,#6d1d15,#1f0706 54%,#6b1c15);color:#ffe5a6;box-shadow:0 2px 10px #260603;position:relative;z-index:5}.logo{font-size:28px;text-shadow:0 2px 4px #180000}.money{display:flex;gap:22px;font-weight:bold;font-size:16px}.gold{color:#ffd250}.blue{color:#54d8ff}.red{color:#ff7580}
.scene{position:relative;min-height:calc(100vh - 54px);background-size:cover;background-position:center;overflow:hidden}.scene:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,5,1,.1),transparent 22%,transparent 76%,rgba(21,5,1,.15));pointer-events:none}.home{background-image:url('home-courtyard.png')}.gladiators{background-image:url('gladiators-courtyard.png')}.training{background-image:url('training-yard.png')}.scene>*{position:relative;z-index:1}.place{position:absolute;display:flex;align-items:center;gap:12px;padding:11px 16px;border:2px solid #dcb257;border-radius:4px;background:linear-gradient(135deg,#332017,#120c08);box-shadow:0 0 0 2px rgba(85,32,13,.85),0 6px 14px #291006;color:#fff0bd;font-size:18px;text-shadow:0 2px #000;cursor:pointer}.place:hover{filter:brightness(1.2)}.place b{color:#f4cd6d;font-size:24px}.arrow{font-size:24px;margin-left:8px}.ludus{left:16%;top:14%}.guild{left:50%;top:22%}.arena{left:71%;top:29%}.inv{left:6%;top:43%}.fighters{left:48%;top:42%}.train{left:47%;top:70%}.upgrades{left:7%;bottom:18%}.market{right:5%;top:49%}.quests{right:20%;bottom:16%}.messages{right:5%;bottom:21%}
.paper{position:absolute;right:2.3%;top:3%;width:215px;padding:17px 19px 19px;border:3px solid #815126;border-radius:10px;background:linear-gradient(110deg,#fff8e7,#edd6aa);box-shadow:0 0 0 3px #ddba71,0 8px 18px #2f1004}.paper h2{margin:0 0 13px;text-align:center;font-size:22px}.rule{height:1px;background:#c8a873;margin:9px 0}.stat{display:flex;gap:11px;align-items:center;margin:13px 0;font-size:16px}.stat i{width:25px;font-style:normal;font-size:24px;text-align:center}.rightcard{width:224px;top:3%;right:2.1%;padding:10px 12px 14px}.heroimg{height:205px;background-image:linear-gradient(180deg,transparent 55%,rgba(255,246,219,.9)),url('gladiators-courtyard.png');background-size:390px auto;background-position:45% 31%;border-bottom:1px solid #c19a61}.name{text-align:center;font-size:28px;margin:4px 0}.sub{text-align:center;font-size:16px;margin:0 0 12px}.smallstat{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid #dbc394;font-size:16px}.yes{color:#18743b}.bad{color:#a62c20}.action{width:100%;margin-top:9px;padding:10px;border:2px solid #dfb65a;background:linear-gradient(135deg,#3a2618,#160c08);color:#ffedba;font:17px Georgia,serif;cursor:pointer}.redbtn{background:linear-gradient(#8b251b,#510b09)}.carousel{position:absolute;left:7%;right:25%;bottom:2%;height:138px;padding:14px 52px;background:rgba(249,238,213,.94);border:2px solid #bd8d4c;box-shadow:0 0 0 2px #f4d895}.roster{height:100%;display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.face{height:92px;border:2px solid #5e3d20;background-image:url('gladiators-courtyard.png');background-size:270px auto;background-position:center 37%;box-shadow:inset 0 -25px 20px rgba(24,8,2,.58);position:relative}.face:nth-child(2){background-position:35% 38%}.face:nth-child(3){background-position:65% 37%}.face:nth-child(4){background-image:url('training-yard.png');background-position:21% 38%}.face:nth-child(5){background-image:url('training-yard.png');background-position:59% 38%}.face:nth-child(6){background-position:76% 38%}.face.selected{border-color:#f3c95e;box-shadow:0 0 12px #ffcc55,inset 0 -25px 20px rgba(24,8,2,.58)}.face span{position:absolute;bottom:0;left:0;right:0;padding:4px;text-align:center;color:#fff1c3;font-size:15px;text-shadow:0 1px 2px #000}.training-types{position:absolute;top:11%;left:21%;right:27%;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.type{height:128px;padding-top:24px;text-align:center;background:linear-gradient(#fff8e6,#e7cda0);border:2px solid #bf9658;box-shadow:0 0 0 2px rgba(106,44,22,.75);font:17px Georgia,serif}.type b{display:block;font-size:36px;margin-bottom:10px;color:#6d351c}.type.selected{box-shadow:0 0 14px #ffcf54,0 0 0 3px #c26b26}.trainingcard h1{text-align:center;margin:4px 0;font-size:30px}.trainingcard .sub{padding-bottom:9px;border-bottom:1px solid #cdb07e}.note{margin-top:12px;padding:9px;border-top:1px solid #cdb07e;font-size:14px;line-height:1.3}.coming{display:grid;place-items:center;text-align:center;height:calc(100vh - 54px);background:radial-gradient(circle,#ead1a0,#722317);color:#fff0c1}.coming h1{font-size:44px}.coming p{font-size:20px}
 .home{background-position:center center}.home:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(33,10,4,.1),transparent 19%,transparent 78%,rgba(33,10,4,.12));pointer-events:none;z-index:0}.home .place{min-width:138px;min-height:48px;justify-content:flex-start;border:1px solid #f5d985;border-radius:2px;background:linear-gradient(180deg,#3d2b1e 0%,#1c120c 48%,#0e0906 100%);box-shadow:0 0 0 2px #74411e,0 4px 0 #140905,0 9px 15px rgba(31,8,1,.48);letter-spacing:.1px}.home .place:before{content:'';position:absolute;inset:3px;border:1px solid rgba(229,188,94,.45);pointer-events:none}.home .place b{width:28px;font-size:22px;color:#f6d77c}.home .place span:nth-child(2){font-size:16px;font-weight:bold}.home .place .arrow{margin-left:auto;color:#f7d577;font-size:26px;line-height:1}.home .place:hover{transform:translateY(-2px);box-shadow:0 0 0 2px #96602a,0 6px 0 #140905,0 14px 20px rgba(31,8,1,.55)}.home .ludus{left:17%;top:15%}.home .guild{left:49%;top:24%}.home .arena{left:72%;top:31%}.home .inv{left:7%;top:45%}.home .fighters{left:47%;top:43%}.home .train{left:47%;top:70%}.home .upgrades{left:8%;bottom:17%}.home .market{right:4%;top:50%}.home .quests{right:21%;bottom:16%}.home .messages{right:4%;bottom:21%}.home .paper{right:2.1%;top:4%;width:226px;padding:18px 19px;border:2px solid #8b5525;border-radius:5px;background:linear-gradient(100deg,rgba(255,251,235,.98),rgba(239,217,170,.98));box-shadow:0 0 0 3px #dfba6b,0 7px 18px rgba(42,13,3,.56)}.home .paper:before{content:'';position:absolute;inset:6px;border:1px solid rgba(146,93,39,.35);pointer-events:none}.home .paper h2{font-size:21px;letter-spacing:.2px}.home .stat{position:relative;margin:12px 0;font-size:15px}.home .stat i{color:#4c2b16;font-size:22px}.home .rule{background:#b99158}
@media(max-width:820px) and (orientation:portrait){.app{display:none}.rotate{min-width:0;min-height:100vh;display:grid;place-items:center;padding:30px;background:#3b100b;color:#ffebbc;text-align:center;font:24px Georgia,serif}.rotate b{font-size:56px;display:block;margin-bottom:14px}}@media(max-height:520px){.app{grid-template-columns:122px 1fr}.side{overflow-y:auto}.crest{height:40px;font-size:26px}.nav{height:31px;gap:6px;padding:0 8px;font-size:11px}.ico{width:20px;font-size:15px}.sidebottom{height:30px;font-size:18px}.top{height:42px;padding:0 15px}.logo{font-size:20px}.money{gap:10px;font-size:12px}.scene{min-height:calc(100vh - 42px)}.paper{transform:scale(.83);transform-origin:top right}.place{padding:7px 11px;font-size:14px}.training-types{top:6%}.type{height:95px;padding-top:12px;font-size:14px}.type b{font-size:26px}.carousel{height:105px}.face{height:65px}.rightcard{transform:scale(.82);transform-origin:top right}.heroimg{height:125px}.home .place{min-width:102px;min-height:32px;padding:4px 7px}.home .place b{width:18px;font-size:14px}.home .place span:nth-child(2){font-size:11px}.home .place .arrow{font-size:17px}.home .paper{transform:scale(.69);transform-origin:top right;right:-5.6%;top:1%}}
</style></head><body><section class="rotate"><div><b>↻</b>En iyi deneyim için telefonu yatay konuma çevir.</div></section><div class="app"><aside class="side"><div class="crest"></div><nav id="nav"></nav><div class="sidebottom">⚑</div></aside><main class="main"><header class="top"><div class="logo">Colosseum &amp; Ludus</div><div class="money"><span class="gold">◉ 12,450</span><span class="blue">◆ 320</span><span class="blue">◆ 18</span><span class="red">◆ 25</span><span>│ ⚙</span></div></header><div id="page"></div></main></div>
<script>
const pages=[['home','⌂','Ana Sayfa'],['gladiators','♞','Gladyatörler'],['training','↔','Antrenman'],['quests','▤','Görevler'],['inventory','▣','Envanter'],['upgrades','⚒','Geliştirmeler'],['market','⚖','Pazar'],['arena','⌂','Arena'],['guild','♟','Guild'],['ludus','▰','Ludus'],['messages','✉','Mesajlar']],nav=document.querySelector('#nav'),page=document.querySelector('#page'),labels={ludus:'Ludus',guild:'Guild',arena:'Arena',inventory:'Envanter',gladiators:'Gladyatörler',training:'Antrenman',upgrades:'Geliştirmeler',market:'Pazar',quests:'Görevler',messages:'Mesajlar'};function btn(s,n,c){return `<button class="place ${c}" onclick="show('${n}')"><b>${s}</b><span>${labels[n]}</span><span class="arrow">›</span></button>`}function home(){return `<section class="scene home">${btn('▰','ludus','ludus')}${btn('♟','guild','guild')}${btn('⌂','arena','arena')}${btn('▣','inventory','inv')}${btn('♞','gladiators','fighters')}${btn('↔','training','train')}${btn('⚒','upgrades','upgrades')}${btn('⚖','market','market')}${btn('▤','quests','quests')}${btn('✉','messages','messages')}<aside class="paper"><h2>Bugünün Durumu</h2><div class="rule"></div><div class="stat"><i>⚔</i>3 görev hazır</div><div class="stat"><i>♞</i>2 gladyatör boşta</div><div class="stat"><i>⚒</i>1 geliştirme uygun</div><div class="stat"><i>✉</i>1 yeni mesaj</div></aside></section>`}function carousel(){let a=['Cassius Nero','Aurus','Varro','Titus','Felix','Drusus'];return `<div class="carousel"><div class="roster">${a.map((n,i)=>`<button class="face ${i===0?'selected':''}" onclick="selectFace(this,'${n}')"><span>${n}</span></button>`).join('')}</div></div>`}function gladiators(){return `<section class="scene gladiators"><aside class="paper rightcard"><div class="heroimg"></div><h1 class="name" id="gname">Cassius Nero</h1><p class="sub">Seviye 12 • Murmillo</p><div class="smallstat">★ Overall <b>76</b></div><div class="smallstat">♞ Stat Gücü <b class="yes">+12%</b></div><div class="smallstat">⚔ Skill Etkisi <b class="yes">+7%</b></div><div class="smallstat">♥ Yorgunluk <b>18%</b></div><div class="smallstat">⌁ Durum <b class="yes">Hazır</b></div><button class="action">▤ &nbsp; Detay &nbsp; ›</button><button class="action redbtn">⚔ &nbsp; Göreve Gönder &nbsp; ›</button><button class="action">↔ &nbsp; Antrenmana Al &nbsp; ›</button></aside>${carousel()}</section>`}function training(){return `<section class="scene training"><div class="training-types"><button class="type selected"><b>⚔</b>Kılıç Talimi</button><button class="type"><b>⬡</b>Savunma Talimi</button><button class="type"><b>🏃</b>Dayanıklılık</button><button class="type"><b>⌁</b>Çeviklik</button></div><aside class="paper rightcard trainingcard"><h1>Antrenman</h1><p class="sub">Günlük Çalışma Planı</p><div class="smallstat">♞ Cassius Nero</div><div class="smallstat">⚔ Kılıç Talimi</div><div class="smallstat">◷ Süre <b>2s 30dk</b></div><div class="smallstat">▥ Stat Gelişimi <b class="yes">+%1.2</b></div><div class="smallstat">♥ Yorgunluk <b class="bad">+%8</b></div><button class="action">▶ &nbsp; Antrenmanı Başlat</button><button class="action redbtn">♟ &nbsp; Gladyatör Değiştir</button><button class="action">▤ &nbsp; Planı Düzenle</button><div class="note">ⓘ Boş kalan gladyatör gün sonunda rastgele bir statta -%1 kaybedebilir.</div></aside>${carousel()}</section>`}function selectFace(e,n){document.querySelectorAll('.face').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');let h=document.querySelector('#gname');if(h)h.textContent=n}function show(id){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.id===id));page.innerHTML=id==='home'?home():id==='gladiators'?gladiators():id==='training'?training():`<section class="coming"><div><h1>${pages.find(x=>x[0]===id)[2]}</h1><p>Bu ekran sonraki tasarım grubunda hazırlanacak.</p></div></section>`}pages.forEach(([id,i,n])=>{let b=document.createElement('button');b.className='nav';b.dataset.id=id;b.innerHTML=`<span class="ico">${i}</span><span>${n}</span>`;b.onclick=()=>show(id);nav.append(b)});show('home');
</script></body></html>
