const pages=[['home','⌂','Ana Sayfa'],['gladiators','♞','Gladyatörler'],['training','↔','Antrenman'],['quests','▤','Görevler'],['inventory','▣','Envanter'],['upgrades','⚒','Geliştirmeler'],['market','⚖','Pazar'],['arena','⌂','Arena'],['guild','♟','Guild'],['ludus','▰','Ludus'],['messages','✉','Mesajlar']],nav=document.querySelector('#nav'),page=document.querySelector('#page'),labels={ludus:'Ludus',guild:'Guild',arena:'Arena',inventory:'Envanter',gladiators:'Gladyatörler',training:'Antrenman',upgrades:'Geliştirmeler',market:'Pazar',quests:'Görevler',messages:'Mesajlar'};function btn(s,n,c){return `<button class="place ${c}" onclick="show('${n}')"><b>${s}</b><span>${labels[n]}</span><span class="arrow">›</span></button>`}function home(){return `<section class="scene home">${btn('▰','ludus','ludus')}${btn('♟','guild','guild')}${btn('⌂','arena','arena')}${btn('▣','inventory','inv')}${btn('♞','gladiators','fighters')}${btn('↔','training','train')}${btn('⚒','upgrades','upgrades')}${btn('⚖','market','market')}${btn('▤','quests','quests')}${btn('✉','messages','messages')}<aside class="paper"><h2>Bugünün Durumu</h2><div class="rule"></div><div class="stat"><i>⚔</i>3 görev hazır</div><div class="stat"><i>♞</i>2 gladyatör boşta</div><div class="stat"><i>⚒</i>1 geliştirme uygun</div><div class="stat"><i>✉</i>1 yeni mesaj</div></aside></section>`}function carousel(){let a=['Cassius Nero','Aurus','Varro','Titus','Felix','Drusus'];return `<div class="carousel"><div class="roster">${a.map((n,i)=>`<button class="face ${i===0?'selected':''}" onclick="selectFace(this,'${n}')"><span>${n}</span></button>`).join('')}</div></div>`}function gladiators(){return `<section class="scene gladiators"><aside class="paper rightcard"><div class="heroimg"></div><h1 class="name" id="gname">Cassius Nero</h1><p class="sub">Seviye 12 • Murmillo</p><div class="smallstat">★ Overall <b>76</b></div><div class="smallstat">♞ Stat Gücü <b class="yes">+12%</b></div><div class="smallstat">⚔ Skill Etkisi <b class="yes">+7%</b></div><div class="smallstat">♥ Yorgunluk <b>18%</b></div><div class="smallstat">⌁ Durum <b class="yes">Hazır</b></div><button class="action">▤ &nbsp; Detay &nbsp; ›</button><button class="action redbtn">⚔ &nbsp; Göreve Gönder &nbsp; ›</button><button class="action">↔ &nbsp; Antrenmana Al &nbsp; ›</button></aside>${carousel()}</section>`}function training(){return `<section class="scene training"><div class="training-types"><button class="type selected"><b>⚔</b>Kılıç Talimi</button><button class="type"><b>⬡</b>Savunma Talimi</button><button class="type"><b>🏃</b>Dayanıklılık</button><button class="type"><b>⌁</b>Çeviklik</button></div><aside class="paper rightcard trainingcard"><h1>Antrenman</h1><p class="sub">Günlük Çalışma Planı</p><div class="smallstat">♞ Cassius Nero</div><div class="smallstat">⚔ Kılıç Talimi</div><div class="smallstat">◷ Süre <b>2s 30dk</b></div><div class="smallstat">▥ Stat Gelişimi <b class="yes">+%1.2</b></div><div class="smallstat">♥ Yorgunluk <b class="bad">+%8</b></div><button class="action">▶ &nbsp; Antrenmanı Başlat</button><button class="action redbtn">♟ &nbsp; Gladyatör Değiştir</button><button class="action">▤ &nbsp; Planı Düzenle</button><div class="note">ⓘ Boş kalan gladyatör gün sonunda rastgele bir statta -%1 kaybedebilir.</div></aside>${carousel()}</section>`}function selectFace(e,n){document.querySelectorAll('.face').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');let h=document.querySelector('#gname');if(h)h.textContent=n}function show(id){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.id===id));page.innerHTML=id==='home'?home():id==='gladiators'?gladiators():id==='training'?training():`<section class="coming"><div><h1>${pages.find(x=>x[0]===id)[2]}</h1><p>Bu ekran sonraki tasarım grubunda hazırlanacak.</p></div></section>`}pages.forEach(([id,i,n])=>{let b=document.createElement('button');b.className='nav';b.dataset.id=id;b.innerHTML=`<span class="ico">${i}</span><span>${n}</span>`;b.onclick=()=>show(id);nav.append(b)});show('home');
function quests(){return `<section class="board missions"><div class="titleplate">Görevler</div><div class="missionlayout"><div class="parchment questlist"><article class="quest"><h3>Basit Görev</h3><div class="questpic"></div><p>Ostia Limanı'nda kaçak mal deposunu bas.</p><b>⌛ 3s &nbsp; ▥ Risk: Düşük</b></article><article class="quest"><h3>Tehlikeli Görev</h3><div class="questpic"></div><p>Kilikya kıyısında korsan sığınağına gece baskını.</p><b>⌛ 8s &nbsp; ▥ Risk: Orta</b></article><article class="quest"><h3>Gizli Görev</h3><div class="questpic"></div><p>Suriye sınırında düşman erzak hattına sabotaj.</p><b>⌛ 16s &nbsp; ▥ Risk: Yüksek</b></article></div><aside class="parchment rights"><h2>Bugünkü Haklar</h2><div class="smallstat">⚔ 3 görev seçilebilir</div><div class="smallstat">♞ Boşta gladyatör: 2</div><div class="smallstat">☑ Tamamlanan görev: 1</div><p>ⓘ Göreve giden gladyatör günlük antrenman EXP'sini alır.</p></aside></div><button class="widebtn" style="max-width:370px;margin:18px auto">⚔ Gladyatör Görevlendir ›</button></section>`}

function market(){let rows=itemNames.concat(['Gladius +4','İki Elli Kılıç +2']);return `<section class="board marketbg"><div class="titleplate">Pazar</div><div class="marketlayout"><main class="parchment"><div class="itemtabs"><button>⚔ Silah</button><button>⬡ Kalkan</button><button>♞ Başlık</button><button>▣ Zırh</button><button>♞ Gladyatör</button></div><div class="filters"><input placeholder="İtem veya gladyatör ara..."><button class="smallbtn">Model: Gladius</button><button class="smallbtn">En Düşük Fiyat</button></div><div class="markethead"><span>İtem</span><span>Model</span><span>Taş Etkileri</span><span>Fiyat</span></div>${rows.map((x,i)=>`<div class="marketrow"><b>⚔ ${x}</b><span>Gladius</span><span>◆ Extra HP +${12-i%3}% &nbsp; ◆ MARS +5%</span><b>◉ ${(1250000-i*93000).toLocaleString('tr-TR')}</b></div>`).join('')}</main><aside class="parchment buybox"><h2>Seçili İlan</h2><div class="weapon">⚔</div><h2>LUDUS +5</h2><h3>◉ 1,250,000 Altın</h3><div class="smallstat">Physical Attack <b>2690 ~ 3088</b></div><div class="smallstat">Critical <b>17</b></div><div class="gem">Safir: Extra HP +12%<br>Kritik +8%</div><div class="gem redgem">Yakut: MARS +5%<br>VICTORIA +4%</div><button class="widebtn">Satın Al</button></aside></div></section>`}
function arena(){let a=[['Ranked Arena','5v5 takım savaşı','Arena’ya Gir'],['Imperial Solo','20 kişi / büyük arena','Arena’ya Gir'],['Haftalık Solo','10 kişi / herkes herkese','Yakında'],['Haftalık Takım','4 takım x 5 kişi','Yakında']];return `<section class="board arenabg"><div class="titleplate">ARENA</div><div class="arena-layout">${a.map((x,i)=>`<article class="arenacard"><div class="arenapic"></div><h2>${x[0]}</h2><p>${x[1]}</p><p><b>${i<2?'Rating 1500':'◷ Yakında'}</b></p><button class="widebtn">${x[2]}</button></article>`).join('')}<aside class="parchment rank"><h2>Arena Durumu</h2><div class="trophy">♞</div><div class="smallstat">Derece <b>Bronz III</b></div><div class="smallstat">Rating <b>1500</b></div><div class="smallstat">Galibiyet <b>0</b></div><div class="smallstat">Mağlubiyet <b>0</b></div><h3>Rozetler</h3><div class="trophies"><span>❧</span><span>❧</span><span>❧</span></div></aside></div></section>`}
function guild(){let members=['Ludus Aurum','Ferrum Ludus','Roma Victor','Sol Invictus'];return `<section class="board guildbg"><div class="titleplate">Guild</div><header class="parchment guildtop"><div class="guildflag">⚔</div><div><h1>Aquila Ludus</h1><p>Guild Seviyesi 12<br>👥 Üye: 24 / 30 &nbsp; ⚔ Guild Gücü: 184,250</p></div><div class="guildactions"><button class="widebtn">Guild Daveti</button><button class="smallbtn">Üye Yönetimi</button></div></header><div class="guildgrid"><section class="parchment guildpanel"><h2>👥 Üyeler</h2>${members.map((x,i)=>`<div class="member"><span>${x}<br><small>Güç ${(8940-i*880).toLocaleString('tr-TR')}</small></span><span class="yes">● Online</span></div>`).join('')}<button class="widebtn">Tüm Üyeler ›</button></section><section class="parchment guildpanel"><h2>⚔ Guild War</h2><div class="warcards"><article class="war"><h2>20v20 Lig Savaşı</h2><p>Haftalık eşleşme</p><p>👥 Katılım: 14 / 20</p><button class="widebtn">Kadroyu Düzenle</button></article><article class="war"><h2>20v80 Kupa</h2><p>4 birlik, tek kazanan</p><p class="yes">Başvuru açık</p><button class="widebtn">Kupaya Katıl</button></article></div></section><section class="parchment guildpanel"><h2>Guild Sıralaması</h2>${['Imperium Maxima','Aquila Ludus','Ferrum Pactum','Capua Wolves','Nova Roma'].map((x,i)=>`<div class="ranking"><b>${i+1}. ${x}</b><span>${1245-i*140}</span></div>`).join('')}</section></div></section>`}

function messages(){let chats=['Lucius','Marcus','Varro','Cassia','Titus'];return `<section class="board messagesbg"><div class="titleplate">Mesajlar</div><div class="message-layout"><aside class="parchment chatlist"><h2>Konuşmalar</h2><div class="itemtabs"><button>Özel</button><button>Guild</button><button>Global</button></div>${chats.map((x,i)=>`<div class="chatrow"><b>♞ ${x}</b><br><small>${i===0?'Pazarda kılıcı gördün mü?':'Bugünkü görev için hazırım.'}</small></div>`).join('')}</aside><main class="parchment thread"><h2>♞ Lucius</h2><p>Özel sohbet</p><div class="bubble"><b>Lucius</b><br>Pazarda kılıcı gördün mü?</div><div class="bubble you"><b>Sen</b><br>Evet, fiyatı biraz yüksek geldi.</div><div class="bubble"><b>Lucius</b><br>Taşları iyi, FORTUNA %74.</div><div class="bubble you"><b>Sen</b><br>Düşünürüm, teşekkürler.</div><div class="sendrow"><input placeholder="Mesaj yaz..."><button class="widebtn">Gönder</button></div></main><aside class="parchment notices"><h2>Sistem Bildirimleri</h2>${['Görev tamamlandı: Ostia Limanı','İtem satıldı: Gladius +4','Gladyatör boşta: Felix','Geliştirme uygun: LUDUS +5','Yeni guild duyurusu var'].map(x=>`<div class="notice">▤ &nbsp; ${x}</div>`).join('')}<button class="widebtn">Tüm Bildirimleri Sil</button></aside></div></section>`}
function show(id){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.id===id));let f={home,gladiators,training,quests,inventory,upgrades,market,arena,guild,ludus,messages}[id];page.innerHTML=f?f():home()}
</script><style>html,body{width:100%;height:100%;overscroll-behavior:none}body{min-width:0!important;overflow:hidden!important}.app{width:100vw;height:100vh;overflow:hidden}.main{height:100vh;overflow:hidden}.scene,.board{height:calc(100vh - 54px);min-height:0!important;overflow:hidden}@media(max-height:520px){.board{zoom:.58;width:172.4%;height:172.4%;min-height:calc((100vh - 42px)*1.724)!important}.scene{height:calc(100vh - 42px)}.board .titleplate{margin-top:10px}}</style></body></html>
