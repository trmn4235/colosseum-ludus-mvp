})();

  const b=bounds[n],scale=84/Math.max(b[2],b[3]),x=(96-b[2]*scale)/2,y=(96-b[3]*scale)/2,id='equipment-crop-'+n;
  return '<svg class="equipment-icon" data-equipment="'+n+'" viewBox="0 0 96 96" preserveAspectRatio="xMidYMid meet" role="img" aria-label="'+label+'" style="display:block;width:100%;height:100%;overflow:hidden"><rect width="96" height="96" fill="#fff"/><defs><clipPath id="'+id+'"><rect x="'+x+'" y="'+y+'" width="'+(b[2]*scale)+'" height="'+(b[3]*scale)+'"/></clipPath></defs><image clip-path="url(#'+id+')" x="'+(x-b[0]*scale)+'" y="'+(y-b[1]*scale)+'" width="'+(1254*scale)+'" height="'+(1254*scale)+'" href="'+LUDUS_EQUIPMENT_ATLAS+'"/></svg>';

 }
 return {svg,index,bounds,helmetKey};
})();





(()=>{
 const $=id=>document.getElementById(id),client=supabase.createClient(ARENA_SUPABASE_CONFIG.url,ARENA_SUPABASE_CONFIG.publishableKey),storageKey='ludus-pending-purchase-v2';

  $('categories').replaceChildren();for(const c of categories){const b=document.createElement('button');b.textContent=c;b.className=c===category?'active':'';b.setAttribute('aria-pressed',String(c===category));b.onclick=()=>{category=c;productPage=0;render();};$('categories').append(b);}
  const products=catalog.filter(i=>i.category===category),pages=Math.max(1,Math.ceil(products.length/4));productPage=Math.min(productPage,pages-1);$('previousProducts').disabled=productPage===0;$('nextProducts').disabled=productPage===pages-1;$('productPage').textContent=(productPage+1)+' / '+pages;
  $('products').replaceChildren();for(const item of products.slice(productPage*4,productPage*4+4)){const article=document.createElement('article');article.className='product';const art=document.createElement('div'),name=document.createElement('h2'),label=document.createElement('div'),price=document.createElement('div'),buy=document.createElement('button');art.className='art';art.innerHTML=LudusIcons.svg(item);art.setAttribute('role','button');art.tabIndex=0;art.setAttribute('aria-label',item.name+' özelliklerini incele');art.onclick=()=>LudusInspect.open(item,true);art.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();LudusInspect.open(item,true);}};name.textContent=item.name;label.className='basic';label.textContent='BASIC · +0 · İncele';price.className='price';price.textContent='100 denarius';buy.className='buy';buy.textContent='Satın al';buy.disabled=busy||!!pending||coins<100;buy.onclick=()=>purchase(item);article.append(art,label,name,price,buy);$('products').append(article);}
 }
 $('previousProducts').onclick=()=>{productPage=Math.max(0,productPage-1);render();};$('nextProducts').onclick=()=>{productPage++;render();};
 async function submit(){
  if(!pending||busy)return;busy=true;render();$('retry').hidden=true;message('Satın alma kaydediliyor…');
  try{const r=await client.rpc('ludus_buy_basic',{p_sku:pending.sku,p_request:pending.request});if(r.error)throw r.error;coins=Number(r.data.gold);localStorage.removeItem(storageKey);pending=null;balance();message('Eşya envanterine eklendi.');}
  catch(e){if(e.code==='P0001'){pending=null;localStorage.removeItem(storageKey);}message('Satın alma tamamlanamadı: '+e.message);$('retry').hidden=!pending;}
  finally{busy=false;render();}
 }
 function purchase(item){if(busy||pending)return;pending={owner,sku:item.sku,request:crypto.randomUUID()};try{localStorage.setItem(storageKey,JSON.stringify(pending));}catch{pending=null;message('Güvenli işlem kaydı oluşturulamadı. Tarayıcı depolamasını açıp tekrar dene.');return;}submit();}
 async function load(){busy=true;message('Pazar hazırlanıyor…');try{const u=await client.auth.getUser();if(u.error||!u.data.user||u.data.user.is_anonymous){location.replace('index.html');return;}owner=u.data.user.id;globalThis.LudusNavigation?.setOwner(owner);const restored=globalThis.LudusNavigation?.restore();if(categories.includes(restored?.category))category=restored.category;if(Number.isInteger(restored?.productPage)&&restored.productPage>=0)productPage=restored.productPage;const [a,c]=await Promise.all([client.from('ludus_accounts').select('gold').eq('user_id',owner).single(),client.from('ludus_shop_catalog').select('*').order('sku')]);if(a.error||c.error)throw a.error||c.error;coins=Number(a.data.gold);catalog=c.data.map(it=>({...it,name:LudusArmourName(it)||(it.kind==='helmet'?LUDUS_HELMET_NAMES[it.model]:null)||it.name,category:it.kind==='gloves'?'Omuzluk':it.category}));try{const saved=JSON.parse(localStorage.getItem(storageKey));if(saved?.owner===owner)pending=saved;}catch{}balance();message('');busy=false;render();if(pending)await submit();}
  catch(e){message('Pazar yüklenemedi: '+e.message);$('retry').hidden=false;}finally{busy=false;}}
 $('retry').onclick=()=>pending?submit():load();load();
})();

<script>/* Shared read-only equipment details. Uses the same stat rules as combat. */
var LudusInspect=(function(){
 const names={gladius:'Kısa kılıç',sica:'Eğri kılıç',spear:'Mızrak',trident:'Trident',net:'Ağ',mace:'Zincirli gürz',whip:'Kırbaç',scissor:'Kol bıçağı',large:'Büyük kalkan',round:'Yuvarlak kalkan',small:'Küçük kalkan'};

 .inventory-heading{display:flex;align-items:center;justify-content:space-between;gap:4px}.inventory-heading h2{margin:0}
 `;
 document.head.append(style);
 const layer=document.createElement('div');layer.id='equipmentInspect';layer.hidden=true;layer.setAttribute('role','dialog');layer.setAttribute('aria-modal','true');layer.setAttribute('aria-labelledby','inspectTitle');
 layer.innerHTML='<section class="inspect-paper"><div class="inspect-head"><h2 id="inspectTitle"></h2><button id="inspectClose" aria-label="Eşya bilgilerini kapat">×</button></div><div class="inspect-body"><div id="inspectArt"></div><div class="inspect-data"><p id="inspectMeta"></p><ul id="inspectStats"></ul><p id="inspectStones"></p></div></div><p id="inspectHint"></p></section>';
 document.body.append(layer);let previous=null;
 const $=id=>document.getElementById(id),number=v=>Number(v.toFixed(2)).toLocaleString('tr-TR');
 const title=i=>i.name||(i.kind==='helmet'?(LUDUS_HELMET_NAMES[i.model]||'Gladyatör miğferi'):names[i.model]||kinds[i.kind]||'Eşya');
 function close(){layer.hidden=true;previous?.focus();previous=null;}
 $('inspectClose').onclick=close;layer.onclick=e=>{if(e.target===layer)close();};
 document.addEventListener('keydown',e=>{if(!layer.hidden&&e.key==='Escape'){e.preventDefault();close();}else if(!layer.hidden&&e.key==='Tab'){e.preventDefault();$('inspectClose').focus();}});
 function open(item,basic=false){
  if(!item)return;previous=document.activeElement;
