const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.01,30),renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,alpha:true});renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;scene.add(new THREE.HemisphereLight(0xffffff,0x766958,2));const light=new THREE.DirectionalLight(0xffffff,2.6);light.position.set(-2,4,4);scene.add(light);window.avatar=LudusOwner.create();scene.add(avatar.root);camera.position.set(0,1,4);camera.lookAt(0,.95,0);const status=document.querySelector('.status');avatar.ready.then(()=>status.textContent='').catch(()=>status.textContent='Model yüklenemedi. Sayfayı yeniden aç.');const editor=LudusOwner.createEditor();document.querySelector('#customize').onclick=()=>editor.open({value:avatar.appearance,onSave:async value=>{const next=LudusOwner.create(value);await next.ready;avatar.dispose();window.avatar=next;scene.add(avatar.root);}});addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});function frame(){requestAnimationFrame(frame);avatar.animate(1/60,false);renderer.render(scene,camera);}frame();
