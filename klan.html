function banner(id,color,bg){color=safeColor(color,'#d8b36d');bg=safeColor(bg,'#791c2a');return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 400" aria-hidden="true"><defs><linearGradient id="cloth" x1="0" x2="1"><stop stop-color="#000" stop-opacity=".26"/><stop offset=".23" stop-color="#fff" stop-opacity=".06"/><stop offset=".51" stop-color="#000" stop-opacity=".1"/><stop offset=".74" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity=".23"/></linearGradient><clipPath id="flagShape"><path d="M25 20H215V380L120 330 25 380z"/></clipPath></defs><g clip-path="url(#flagShape)"><path fill="'+bg+'" d="M25 20H215V380L120 330 25 380z"/><path fill="url(#cloth)" d="M25 20H215V380H25z"/><path d="M33 28H207V365L120 318 33 365z" fill="none" stroke="'+color+'" stroke-width="2" opacity=".7"/><svg x="53" y="98" width="134" height="134" viewBox="0 0 100 100" style="color:'+color+';--crest-bg:'+bg+'"><g fill="currentColor">'+rows[Math.max(0,Math.min(29,Number(id)-1))][1]+'</g></svg><path d="M77 253h86M92 261h56" stroke="'+color+'" opacity=".65"/></g><rect x="12" y="7" width="216" height="13" rx="5" fill="'+color+'"/><circle cx="12" cy="13" r="7" fill="'+color+'"/><circle cx="228" cy="13" r="7" fill="'+color+'"/></svg>';}
return{rows:rows.map((r,i)=>({id:i+1,name:r[0]})),colors,symbol,banner};
})();
</script>
<script>(()=>{
'use strict';
const $=id=>document.getElementById(id),E=LudusClanEmblems,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=n=>Number(n||0).toLocaleString('tr-TR');
const client=LudusClient.create(ARENA_SUPABASE_CONFIG.url,ARENA_SUPABASE_CONFIG.publishableKey),pendingKey='ludus-clan-pending-v22';
let owner=null,state=null,view='explore',busy=false,search=[],ludus=[],pages={},vaultTab='vault',manageTab='applications',selectedItem=null,confirmAction=null;
let draft={name:'',emblem:1,background:'#791c2a',emblem_color:'#d8b36d'};
const classes={murmillo:'Murmillo',thraex:'Thraex',hoplomachus:'Hoplomachus',secutor:'Secutor',retiarius:'Retiarius',provocator:'Provocator',scissor:'Scissor'};
const icon=(id,color='#d8b36d',bg='#791c2a')=>E.symbol(id,color,bg),btn=(text,a,data={},cls='')=>'<button class="button '+cls+'" data-action="'+a+'" '+Object.entries(data).map(([k,v])=>'data-'+k+'="'+esc(v)+'"').join(' ')+'>'+text+'</button>';
const itemName=i=>({gladius:'Gladius',sica:'Eğri kılıç',spear:'Mızrak',trident:'Trident',net:'Ağ',mace:'Zincirli gürz',whip:'Kırbaç',scissor:'Kol bıçağı',large:'Büyük kalkan',medium:'Orta kalkan',small:'Küçük kalkan',roman:'Roma miğferi',gladiator:'Gladyatör miğferi',knights:'Şövalye miğferi',winged:'Kanatlı miğfer',gladiator_chest:'Gladyatör göğüslüğü',chest_plate:'Göğüs zırhı',armor_shoulder:'Omuz koruma',shoulder_armor:'Omuz zırhı'}[i.model]||{weapon:'Silah',shield:'Kalkan',helmet:'Miğfer',chest:'Göğüs zırhı',gloves:'Omuzluk',legs:'Bacaklık'}[i.kind]||'Eşya');
function fit(){const w=innerWidth,h=innerHeight,scale=Math.min(w/1440,h/760),stage=$('clanStage');stage.style.width=w/scale+'px';stage.style.height=h/scale+'px';stage.style.transform='scale('+scale+')';$('portrait').hidden=w>=h;}
addEventListener('resize',fit);visualViewport?.addEventListener('resize',fit);fit();
function msg(text,error=false){$('message').textContent=text;$('message').classList.toggle('error',error);}
function pending(){try{const p=JSON.parse(localStorage.getItem(pendingKey));return p?.owner===owner?p:null;}catch{return null;}}
function setBusy(b){busy=b;$('refresh').disabled=b;for(const el of document.querySelectorAll('#screen button,#screen input,#screen select')){if(b){el.dataset.wasDisabled=String(el.disabled);el.disabled=true;}else if(el.dataset.wasDisabled!==undefined){el.disabled=el.dataset.wasDisabled==='true';delete el.dataset.wasDisabled;}}}
async function rpc(action,data={},request=null){const abort=new AbortController(),t=setTimeout(()=>abort.abort(),15000);try{const r=await client.rpc('ludus_clan',{p_action:action,p_data:data,p_request:request}).abortSignal(abort.signal);if(r.error){const e=Error(r.error.message||'Klan işlemi tamamlanamadı.');e.known=!!r.error.code&&!String(r.error.code).startsWith('PGRST')&&!r.error.message?.includes('Failed to fetch');throw e;}return r.data;}catch(e){if(e.name==='AbortError')throw Error('Bağlantı zaman aşımına uğradı.');throw e;}finally{clearTimeout(t);}}
async function mutate(action,data={},reuse=false){if(busy)return;const old=pending();if(old&&!reuse){msg('Önce bekleyen işlemi yeniden dene.',true);$('retry').hidden=false;return;}const p=reuse?old:{owner,action,data,id:crypto.randomUUID()};if(!p)return;try{localStorage.setItem(pendingKey,JSON.stringify(p));}catch{msg('Tarayıcı işlem kaydını saklayamıyor. Gizli modu kapatıp tekrar dene.',true);return;}setBusy(true);msg('İşlem kaydediliyor…');try{const r=await rpc(p.action,p.data,p.id);state=r.state;localStorage.removeItem(pendingKey);$('retry').hidden=true;if(!state.clan&&['create','request_accept'].includes(p.action))view='explore';else if(state.clan&&['create','request_accept'].includes(p.action))view='home';render();msg(r.repeated?'Bekleyen işlem doğrulandı; ikinci kez uygulanmadı.':'Klan bilgileri kaydedildi.');}catch(e){if(e.known){localStorage.removeItem(pendingKey);$('retry').hidden=true;}else $('retry').hidden=false;msg(e.message,true);}finally{setBusy(false);}}
async function load(silent=false){if(busy)return;setBusy(true);if(!silent)msg('Klan bilgileri yenileniyor…');try{state=await rpc('state');if(!state.clan&&!['explore','create','requests'].includes(view))view='explore';if(state.clan&&['explore','create','requests'].includes(view))view='home';if(!silent||['home','trophies'].includes(view))render();if(!silent)msg('Klan bilgileri güncel.');}catch(e){msg(e.message,true);$('retry').hidden=false;}finally{setBusy(false);}}
function frame(title,subtitle,cls,html){$('pageTitle').textContent=title;$('pageSubtitle').textContent=subtitle;$('screen').className='screen '+cls;$('screen').innerHTML=html;}
function crest(c){return'<div class="crest" style="background:'+esc(c.background)+'">'+icon(c.emblem,c.emblem_color,c.background)+'</div>';}
function paginate(key,rows,size,renderRow){let p=Math.max(0,Math.min(pages[key]||0,Math.max(0,Math.ceil(rows.length/size)-1)));pages[key]=p;return rows.slice(p*size,(p+1)*size).map(renderRow).join('')+(rows.length>size?'<div class="pagination"><button data-action="page" data-key="'+key+'" data-page="'+(p-1)+'" '+(p===0?'disabled':'')+'>‹</button><span>'+(p+1)+' / '+Math.ceil(rows.length/size)+'</span><button data-action="page" data-key="'+key+'" data-page="'+(p+1)+'" '+((p+1)*size>=rows.length?'disabled':'')+'>›</button></div>':'');}
function empty(text,id=2){return'<div class="empty">'+icon(id,'#b7a172','#faf8f2')+text+'</div>';}
function render(){if(!state)return;$('walletName').textContent=state.wallet.ludus_name;$('walletGold').textContent=num(state.wallet.gold);const c=state.clan;$('brandCrest').innerHTML=icon(c?.emblem||2,c?.emblem_color||'#d8b36d',c?.background||'#651c2b');$('sideCrest').innerHTML=icon(c?.emblem||1,c?.emblem_color||'#d8b36d',c?.background||'#651c2b');$('clanTag').textContent=c?'SEVİYE '+c.level+' / 20':'KENDİ BİRLİĞİNİ KUR';
const tabs=c?[['home','Klanım',13],['members','Üyeler',25],['roster','Savaş kadrosu',6],['vault','Ortak kasa',14],['trophies','Kupa salonu',2],...(state.leader?[['manage','Yönetim',30]]:[])]:[['explore','Klan ara',13],['create','Klan kur',1],['requests','Davetler',25]];
if(!tabs.some(t=>t[0]===view))view=tabs[0][0];$('navigation').innerHTML=tabs.map(([id,name,n])=>'<button class="nav '+(view===id?'active':'')+'" data-view="'+id+'" aria-pressed="'+(view===id)+'">'+icon(n,view===id?'#624629':'#e5cb8e',view===id?'#e9d09a':'#651c2b')+'<span>'+name+(id==='requests'&&state.requests.length?' ('+state.requests.length+')':'')+'</span></button>').join('');
({explore:showExplore,create:showCreate,requests:showRequests,home:showHome,members:showMembers,roster:showRoster,vault:showVault,trophies:showTrophies,manage:showManage}[view])();if(busy)setBusy(true);}
function showExplore(){frame('Bir klana katıl','Klan ismiyle ara, başvurunu liderin değerlendirsin.','exploreGrid','<section class="panel listPanel"><h2>Klanları keşfet</h2><form class="searchbox" data-form="search"><input name="query" id="searchName" maxlength="32" minlength="2" placeholder="Klan adını yaz…" aria-label="Klan adı" required><button class="button">Ara</button></form><div class="rows">'+(search.length?paginate('search',search,4,c=>'<div class="row">'+crest(c)+'<div class="identity"><strong>'+esc(c.name)+'</strong><small>Seviye '+c.level+' · '+c.members+' / '+c.capacity+' üye</small></div>'+btn(state.requests.some(q=>q.clan_id===c.id)?'Başvuruldu':'Başvur','apply',{id:c.id},'compact')+'</div>'):empty('Katılmak istediğin klanı adıyla bul.'))+'</div></section><section class="panel bannerPreview">'+E.banner(25,'#c3a060','#641f2d')+'<h2>Her zafer, klanın için.</h2><p class="small">Kendi bayrağın, ortak kasan ve savaş kadron.</p>'+btn('Klanını kur','view',{view:'create'})+'</section>');
for(const b of document.querySelectorAll('[data-action="apply"]'))if(state.requests.some(q=>q.clan_id===b.dataset.id)||search.find(c=>c.id===b.dataset.id)?.members>=search.find(c=>c.id===b.dataset.id)?.capacity)b.disabled=true;}
function showCreate(){frame('Klanını kur','30 arma arasından seç; bayrağının iki rengini belirle.','createGrid','<section class="panel bannerPreview" id="bannerPreview">'+E.banner(draft.emblem,draft.emblem_color,draft.background)+'<h2 id="previewName">'+esc(draft.name||'Yeni klanın')+'</h2><p class="small">Arma ve renkler bayrağında görünecek.</p></section><section class="panel createCenter"><label class="field">Klan adı<input id="createName" maxlength="32" minlength="3" value="'+esc(draft.name)+'" placeholder="Örn. Legio Aurea" autocomplete="off"></label><div class="emblemGrid">'+E.rows.map(r=>'<button data-action="emblem" data-id="'+r.id+'" title="'+r.name+'" aria-label="'+r.name+'" aria-pressed="'+(draft.emblem===r.id)+'" class="emblemButton '+(draft.emblem===r.id?'selected':'')+'">'+icon(r.id,'#76552f','#f7f0e1')+'<small>'+r.name+'</small></button>').join('')+'</div></section><section class="panel createColors"><h2>Bayrak renkleri</h2>'+['background','emblem_color'].map((key,i)=>'<h3>'+(i?'Arma rengi':'Arka plan rengi')+'</h3><div class="palette">'+E.colors.map(color=>'<button class="swatch '+(draft[key]===color?'selected':'')+'" style="background:'+color+'" data-action="color" data-key="'+key+'" data-color="'+color+'" aria-label="'+color+'" aria-pressed="'+(draft[key]===color)+'"></button>').join('')+'</div><label class="customColor">Özel renk<input type="color" data-color-key="'+key+'" value="'+draft[key]+'" aria-label="Özel '+(i?'arma':'arka plan')+' rengi"></label>').join('')+'<p class="small">Kuruluş ücretsizdir.<br>Seviye 1 · 10 üye kapasitesi.</p>'+btn('Klanı kur','create')+'</section>');}
function showRequests(){frame('Davetler ve başvurular','Klan davetlerini yanıtla, gönderdiğin başvuruları gör.','exploreGrid','<section class="panel listPanel"><h2>Bekleyen istekler</h2><div class="rows">'+(state.requests.length?paginate('requests',state.requests,4,q=>'<div class="row">'+crest(q)+'<div class="identity"><strong>'+esc(q.name)+'</strong><small>'+(q.kind==='invite'?'Klana davet edildin':'Başvurun değerlendiriliyor')+'</small></div>'+(q.kind==='invite'?btn('Katıl','request_accept',{id:q.id},'compact')+btn('Reddet','request_decline',{id:q.id},'secondary compact'):btn('İptal et','request_cancel',{id:q.id},'secondary compact'))+'</div>'):empty('Bekleyen davetin veya başvurun yok.'))+'</div></section><section class="panel bannerPreview">'+E.banner(2,'#c3a060','#1f493a')+'<h2>Tek Ludus, tek klan.</h2><p class="small">Bir klana katılınca diğer bekleyen başvurular kapanır.</p></section>');}
function trophyCards(large=false){const t=state.trophies||{},types=[['league','Klan ligi',14],['cup','Klan kupası',30],['solo20','Solo 20',15],['4x5','4x5',25]];return types.map(([k,name,id])=>'<article class="panel trophy">'+icon(id,'#bb954c','#fffdf9')+'<div><strong>'+num(t[k])+'</strong><span>'+name+'</span><small class="small">'+(state.championship_exp?.[k]||0)+' EXP / şampiyonluk</small></div></article>').join('');}
function showHome(){const c=state.clan,leader=state.members.find(m=>m.leader),max=c.level===20;frame(c.name,'Bayrağımız altında, aynı hedef için.','homeGrid','<section class="panel bannerPreview homeBanner">'+E.banner(c.emblem,c.emblem_color,c.background)+'<h2>'+esc(c.name)+'</h2><span class="clanLead">'+(state.leader?'KLAN LİDERİ':'KLAN ÜYESİ')+'</span><p class="small">'+esc(leader?.name||'')+'</p></section><div class="homeDetails"><div class="metrics"><article class="panel metric"><label>Klan seviyesi</label><strong>'+c.level+' <small>/ 20</small></strong><small>Bir sonraki kapasite: '+(max?30:10+Math.round(20*c.level/19))+' üye</small></article><article class="panel metric"><label>Üyeler</label><strong>'+c.member_count+' <small>/ '+c.capacity+'</small></strong><small>'+state.members.filter(m=>m.online).length+' Ludus çevrimiçi</small></article><article class="panel metric"><label>Ortak denarius</label><strong>'+num(c.gold)+'</strong><small>Seviye geliştirmeleri için</small></article></div><section class="panel expPanel"><div><h2>'+(max?'En yüksek klan seviyesi':'Birlik büyüyor')+'</h2><span class="small">'+num(c.experience)+' EXP'+(max?'':' / '+num(c.exp_cost)+' EXP')+'</span><div class="progress"><i style="width:'+(max?100:Math.min(100,c.experience/c.exp_cost*100))+'%"></i></div><p class="small">'+(max?'Klanın 30 üyeye ev sahipliği yapabilir.':'Seviye '+(c.level+1)+' için '+num(c.exp_cost)+' EXP + '+num(c.coin_cost)+' denarius harcanır.')+'</p><p class="small">Toplam kazanılan: '+num(c.lifetime_experience)+' EXP</p></div><div>'+btn(state.leader?'Seviyeyi artır':'Ortak kasaya git',state.leader?'level_up':'view',state.leader?{}:{view:'vault'})+'</div></section></div><div class="trophies">'+trophyCards()+'</div>');const level=document.querySelector('[data-action="level_up"]');if(level)level.disabled=max||c.experience<c.exp_cost||c.gold<c.coin_cost;}
function showMembers(){frame('Klan üyeleri','Ludus isimleri, çevrimiçi üyeler ve davetler.','memberGrid','<section class="panel listPanel"><h2>'+state.clan.member_count+' / '+state.clan.capacity+' Ludus</h2><div class="rows">'+paginate('members',state.members,4,m=>'<div class="row">'+icon(m.leader?30:5,'#a8874c','#fffdf9').replace('<svg ','<svg style="width:38px;height:38px" ')+'<div class="identity"><strong>'+esc(m.name)+'</strong><small>@'+esc(m.username)+' · '+(m.leader?'Klan lideri':'Üye')+(m.vault_access?' · Kasa yetkili':'')+'</small></div><span class="status '+(m.online?'online':'')+'">'+(m.online?'Çevrimiçi':'Çevrimdışı')+'</span></div>')+'</div><div class="actions" style="margin-top:auto;padding-top:16px">'+(!state.leader?btn('Klandan ayrıl','ask_leave',{},'secondary compact'):'<span class="small">Liderlik ve kasa yetkileri Yönetim bölümündedir.</span>')+'</div></section><section class="panel listPanel">'+(state.leader?'<h2>Ludus davet et</h2><form class="searchbox" data-form="find_ludus"><input id="findLudus" name="query" maxlength="40" minlength="2" placeholder="Ludus adı…" aria-label="Davet edilecek Ludus adı" required><button class="button compact">Bul</button></form><p class="small">Aynı isimdeki Ludus’ları kullanıcı adından ayırt et.</p><div class="rows">'+(ludus.length?paginate('ludus',ludus,3,m=>'<div class="row"><div class="identity"><strong>'+esc(m.name)+'</strong><small>@'+esc(m.username)+'</small></div>'+(m.in_clan?'<span class="status">Üye</span>':btn('Davet','invite',{id:m.user_id},'compact'))+'</div>'):empty('Davet etmek istediğin Ludus’u bul.',25))+'</div>':'<h2>Klan davetleri</h2>'+empty('Yeni üyeleri klan lideri davet eder. Savaş kadrosuna çağrıldığında gladyatörünü kendin seçersin.',25))+'</section>');}
function showRoster(){const r=state.roster;frame('Klan savaşları kadrosu','Lider davet eder, üyeler gladyatörlerini seçer; kadro birlikte kilitlenir.','rosterGrid',r?'<section class="panel rosterMain"><div class="rosterTop"><h2 style="border:0;margin:0;padding:0">'+esc(r.name)+'</h2><div class="actions"><span class="status '+(r.state==='locked'?'locked':'')+'">'+(r.state==='locked'?'Kilitli':'Hazırlık')+' · '+r.entries.length+' / 20</span></div></div><div class="formation">'+Array.from({length:20},(_,n)=>{const e=r.entries.find(e=>e.position===n+1);return'<article class="rosterSlot '+(e?'':'emptySlot')+'"><span class="num">'+(n+1)+'</span>'+(e?icon(5,'#a68648','#faf8f2')+'<strong>'+esc(e.gladiator_name)+'</strong><small>'+esc(e.name)+' · '+esc(classes[e.class]||e.class)+'</small>'+(r.state==='draft'&&(state.leader||e.user_id===owner)?'<button class="removeSlot" data-action="roster_remove" data-id="'+e.id+'" aria-label="'+esc(e.gladiator_name)+' kadrodan çıkar">×</button>':''):'<span style="font-size:27px">+</span>')+'</article>';}).join('')+'</div><div class="actions" style="padding-top:15px">'+(state.leader?btn(r.state==='locked'?'Kilidi aç':'Kadroyu kilitle',r.state==='locked'?'roster_unlock':'ask_lock',{},'compact')+btn('Kadroyu kapat','ask_cancel',{},'secondary compact'):'<span class="small">Kadro kilidini klan lideri yönetir.</span>')+'</div></section><section class="panel rosterSide"><h2>'+(r.kind==='league'?'Klan ligi':'Klan kupası')+'</h2>'+(r.state==='draft'&&state.leader?'<form class="searchbox" data-form="roster_invite"><select name="member" aria-label="Kadroya davet edilecek üye" style="flex:1;min-width:0;border:1px solid #c5b38c;background:#fffdf9;border-radius:4px;padding:9px;font-size:15px">'+state.members.filter(m=>m.user_id!==owner).map(m=>'<option value="'+m.user_id+'">'+esc(m.name)+'</option>').join('')+'</select><button class="button compact">Davet et</button></form>':'')+(r.state==='locked'?empty('Gladyatörler ve üzerlerindeki ekipmanlar bu kadroya ayrıldı. Değişiklik için lider kilidi açmalı.',13):r.invited?'<h3>Gladyatörünü seç</h3><p class="small">Eklediğin gladyatör, lider kilitleyene kadar hazırlanabilir.</p><div class="gladiatorChoices">'+paginate('gladiators',state.gladiators.filter(g=>!r.entries.some(e=>e.gladiator_id===g.id)),4,g=>'<button class="gladiatorChoice" data-action="roster_join" data-id="'+g.id+'" '+(g.status!=='available'||g.clan_roster_id?'disabled':'')+'>'+icon(5,'#a68648','#fffdf9')+'<strong>'+esc(g.name)+'</strong><small>'+esc(classes[g.class]||g.class)+' · Seviye '+g.level+'</small></button>')+'</div>':empty('Lider seni savaş kadrosuna davet ettiğinde gladyatörünü buradan seçebilirsin.',6))+'<div class="notice"><strong>'+r.invites.filter(i=>i.state==='accepted').length+' kabul · '+r.invites.filter(i=>i.state==='pending').length+' davet bekliyor</strong><p class="warDisclaimer">Bu ekran kadro hazırlığıdır. Klan şampiyonalarının savaş takvimi ve eşleştirmesi henüz açılmadı.</p></div></section>':'<section class="panel bannerPreview">'+E.banner(state.clan.emblem,state.clan.emblem_color,state.clan.background)+'<h2>Henüz bir kadro oluşturulmadı.</h2></section><section class="panel rosterSide"><h2>Savaş birliğini hazırla</h2>'+(state.leader?'<form data-form="roster_create" style="display:grid;gap:19px"><label class="field">Kadro adı<input name="name" maxlength="40" minlength="3" required placeholder="Örn. Birinci Lejyon"></label><label class="field">Şampiyona<select name="kind"><option value="league">Klan ligi</option><option value="cup">Klan kupası</option></select></label><button class="button">Kadroyu oluştur</button></form>':empty('Savaş kadrosunu klan lideri oluşturur.',6))+'<p class="notice">20 gladyatör yuvası. Her üye davetini kabul ederek kendi gladyatörlerini seçer.</p><p class="warDisclaimer" style="margin-top:auto">Klan savaşları için kadro hazırlanabilir. Şampiyona savaşları henüz oynanabilir değildir.</p></section>');}
function showVault(){const rows=(vaultTab==='vault'?state.vault:state.inventory)||[],i=rows.find(i=>i.id===selectedItem),ledger=state.ledger||[];frame('Ortak kasa','Tüm üyeler denarius ekleyebilir; eşyalar için liderin kasa yetkisi gerekir.','vaultGrid','<section class="panel vaultItems"><h2>Klan ekipmanları</h2>'+(state.vault_access?'<div class="tabs"><button class="tab '+(vaultTab==='vault'?'active':'')+'" data-action="vault_tab" data-tab="vault">Kasa · '+state.vault.length+' / 60</button><button class="tab '+(vaultTab==='inventory'?'active':'')+'" data-action="vault_tab" data-tab="inventory">Envanterim · '+state.inventory.length+'</button></div><div class="itemGrid">'+rows.slice((pages.items||0)*6,(pages.items||0)*6+6).map(i=>'<button class="itemCard '+(i.id===selectedItem?'selected':'')+'" data-action="item_select" data-id="'+i.id+'"><div class="art">'+LudusIcons.svg(i)+'</div><strong>'+esc(itemName(i))+' +'+i.enhancement+'</strong><small>'+((i.emeralds||[]).length)+' zümrüt yuvası</small></button>').join('')+'</div>'+paginate('items',rows,6,()=> '')+(rows.length===0?empty(vaultTab==='vault'?'Ortak eşya kasası henüz boş.':'Takılı olmayan, kilitsiz eşyaların burada görünür.'): ''):empty('Kasa erişimin kapalı.<br>Yetki almak için klan liderine başvur.',13))+'</section><section class="panel vaultDetail"><h2>'+(i?esc(itemName(i))+' +'+i.enhancement:'Eşya ayrıntısı')+'</h2>'+(i?'<div class="detailArt">'+LudusIcons.svg(i)+'</div><div class="detailStats">'+LudusItemSystem.statsFor(i.kind).map(s=>'<div class="statRow"><span>'+esc(s.label||s.name)+'</span><strong>'+num(Math.round((LudusItemSystem.effectiveStats(i)[s.key]||0)*10)/10)+'</strong></div>').join('')+'</div><span class="notice">Eşyanın + seviyesi, safir ve zümrütleri korunur.</span>'+btn(vaultTab==='vault'?'Envanterime al':'Kasaya bırak',vaultTab==='vault'?'vault_withdraw':'vault_deposit',{id:i.id}):empty('Kasadan veya envanterinden bir eşya seç.',13))+'</section><section class="panel treasury"><h2>Denarius kasası</h2><strong class="amount">'+num(state.clan.gold)+'</strong><span class="small">Klan seviyesi için ortak birikim.</span><form class="searchbox" data-form="deposit"><input name="amount" inputmode="numeric" type="number" min="1" max="10000000" step="1" required placeholder="Miktar" aria-label="Eklenecek denarius"><button class="button compact">Ekle</button></form><h3>Kasa hareketleri</h3><div>'+paginate('ledger',ledger,5,l=>'<div class="ledgerRow"><div><strong>'+esc(l.name)+'</strong><small>'+({deposit:'Denarius ekledi',level:'Klan seviyesi arttı',item_deposit:'Eşya bıraktı',item_withdraw:'Eşya aldı'}[l.kind])+'</small></div><b>'+(l.amount?((l.amount>0?'+':'')+num(l.amount)):(l.detail?.kind?esc(itemName(l.detail)):'Eşya'))+'</b></div>')+'</div></section>');}
function showTrophies(){frame('Kupa salonu','Her şampiyonluk için bir model, altında kazanılan kupa sayısı.','clanTrophyPage','<section class="trophyShowcase">'+trophyCards(true)+'</section><section class="panel bannerPreview">'+E.banner(state.clan.emblem,state.clan.emblem_color,state.clan.background)+'<h2>Zaferlerimiz sergileniyor.</h2><p class="small">Klan üyelerinin klana katıldıktan sonraki Solo 20 ve 4x5 zaferleri, ortak kupa salonunda sayılır.</p></section>');}
function showManage(){const applications=(state.applications||[]).filter(q=>q.kind==='application'),invitations=(state.applications||[]).filter(q=>q.kind==='invite');frame('Klan yönetimi','Kasa yetkileri, üyelik başvuruları ve liderlik.','manageGrid','<section class="panel listPanel"><h2>Kasa erişimi ve üyeler</h2><div class="rows">'+paginate('permissions',state.members,4,m=>'<div class="permissionRow"><div class="identity"><strong>'+esc(m.name)+'</strong><small>@'+esc(m.username)+(m.leader?' · Lider':'')+'</small></div>'+(m.leader?'<span class="status">Tam yetki</span>':btn(m.vault_access?'Yetkiyi kaldır':'Kasa yetkisi ver','permission',{id:m.user_id,enabled:!m.vault_access},'secondary compact')+btn('Lider yap','ask_transfer',{id:m.user_id},'secondary compact')+btn('Çıkar','ask_kick',{id:m.user_id},'danger compact'))+'</div>')+'</div><p class="notice" style="margin-top:auto">Kasa yetkisi verilen üyeler ortak eşyaları alabilir veya bırakabilir. Denarius eklemek için yetki gerekmez.</p></section><section class="panel listPanel"><h2>Üyelik istekleri</h2><div class="tabs"><button class="tab '+(manageTab==='applications'?'active':'')+'" data-action="manage_tab" data-tab="applications">Başvuru · '+applications.length+'</button><button class="tab '+(manageTab==='invitations'?'active':'')+'" data-action="manage_tab" data-tab="invitations">Davet · '+invitations.length+'</button></div><div class="rows">'+((manageTab==='applications'?applications:invitations).length?paginate('managementRequests',manageTab==='applications'?applications:invitations,4,q=>'<div class="row"><div class="identity"><strong>'+esc(q.name)+'</strong><small>@'+esc(q.username)+'</small></div>'+(q.kind==='application'?btn('Kabul','request_accept',{id:q.id},'compact')+btn('Reddet','request_decline',{id:q.id},'secondary compact'):btn('İptal','request_cancel',{id:q.id},'secondary compact'))+'</div>'):'<p class="small">Bekleyen istek yok.</p>')+'</div><p class="notice" style="margin-top:auto">Liderlik devri, üye yönetimi ve kasa yetkileri bu bölümden düzenlenir.</p></section>');}
function ask(title,text,action){confirmAction=action;$('confirmTitle').textContent=title;$('confirmText').textContent=text;$('confirmLayer').hidden=false;$('confirmYes').focus();}
$('confirmNo').onclick=()=>{$('confirmLayer').hidden=true;confirmAction=null;};$('confirmYes').onclick=()=>{const fn=confirmAction;$('confirmLayer').hidden=true;confirmAction=null;fn?.();};addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('confirmLayer').hidden)$('confirmNo').click();});
$('navigation').onclick=e=>{const b=e.target.closest('[data-view]');if(b&&!busy){view=b.dataset.view;render();}};
$('screen').addEventListener('input',e=>{if(e.target.id==='createName'){draft.name=e.target.value;$('previewName').textContent=draft.name||'Yeni klanın';}});
$('screen').addEventListener('change',e=>{const key=e.target.dataset.colorKey;if(key){draft[key]=e.target.value;showCreate();}});
$('screen').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const f=e.target,form=new FormData(f),type=f.dataset.form;if(type==='search'||type==='find_ludus'){setBusy(true);try{const r=await rpc(type==='search'?'search':'find_ludus',{name:form.get('query')});if(type==='search')search=r.clans;else ludus=r.ludus;pages[type==='search'?'search':'ludus']=0;render();msg(type==='search'?(search.length+' klan bulundu.'):(ludus.length+' Ludus bulundu.'));}catch(err){msg(err.message,true);}finally{setBusy(false);}return;}if(type==='deposit')await mutate('deposit',{amount:Number(form.get('amount'))});if(type==='roster_create')await mutate('roster_create',{name:form.get('name'),kind:form.get('kind')});if(type==='roster_invite'&&form.get('member'))await mutate('roster_invite',{roster_id:state.roster.id,user_id:form.get('member')});});
$('screen').onclick=async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled||busy)return;const a=b.dataset.action,id=b.dataset.id,rid=state.roster?.id;if(a==='view'){view=b.dataset.view;render();return;}if(a==='page'){pages[b.dataset.key]=Number(b.dataset.page);render();return;}if(a==='emblem'){draft.emblem=Number(id);showCreate();return;}if(a==='color'){draft[b.dataset.key]=b.dataset.color;showCreate();return;}if(a==='manage_tab'){manageTab=b.dataset.tab;pages.managementRequests=0;showManage();return;}if(a==='vault_tab'){vaultTab=b.dataset.tab;selectedItem=null;pages.items=0;showVault();return;}if(a==='item_select'){selectedItem=id;showVault();return;}if(a==='create'){draft.name=$('createName').value.trim();if(draft.name.length<3){msg('Klan adı en az 3 karakter olmalı.',true);return;}await mutate('create',draft);return;}
if(a==='ask_lock'){ask('Kadroyu kilitle','Seçilen '+state.roster.entries.length+' gladyatör ve üzerlerindeki eşyalar bu kadroya ayrılacak. Kilit açıkken başka savaşa veya antrenmana giremezler.',()=>mutate('roster_lock',{roster_id:rid}));return;}
if(a==='ask_cancel'){ask('Kadroyu kapat','Mevcut kadro kapanacak, gladyatör ve eşya kilitleri açılacak.',()=>mutate('roster_cancel',{roster_id:rid}));return;}
if(a==='ask_leave'){ask('Klandan ayrıl','Klan üyeliğin sona erecek. Ortak kasaya bıraktığın eşyalar ve denarius klana ait kalır.',()=>mutate('leave'));return;}
if(a==='ask_transfer'||a==='ask_kick'){const member=state.members.find(m=>m.user_id===id);ask(a==='ask_transfer'?'Liderliği devret':'Üyeyi çıkar',(member?.name||'Üye')+(a==='ask_transfer'?' klan lideri olacak; klan yönetimi ve kasa yetkilerini alacak.':' klandan çıkarılacak. Ortak kasa katkıları klana ait kalacak.'),()=>mutate(a==='ask_transfer'?'transfer_leader':'kick',{user_id:id}));return;}
const data={apply:{clan_id:id},invite:{user_id:id},request_accept:{id},request_decline:{id},request_cancel:{id},permission:{user_id:id,enabled:b.dataset.enabled==='true'},vault_deposit:{item_id:id},vault_withdraw:{item_id:id},roster_join:{roster_id:rid,gladiator_id:id},roster_remove:{roster_id:rid,entry_id:id},roster_unlock:{roster_id:rid},level_up:{}}[a];if(data)await mutate(a,data);};
$('back').onclick=()=>globalThis.LudusNavigation?.back('ludus.html?v=revision96');$('refresh').onclick=()=>load();$('retry').onclick=()=>pending()?mutate(null,null,true):load();
globalThis.LudusNavigation?.register(()=>({view,pages,vaultTab}));
(async()=>{try{const {data,error}=await client.auth.getUser();if(error||!data.user){msg('Klan salonu için hesabına giriş yap.',true);$('screen').innerHTML=empty('Hesabına giriş yapıp klan salonunu tekrar aç.')+'<div class="actions">'+btn('Hesabıma git','login')+'</div>';$('screen').onclick=e=>{if(e.target.closest('[data-action="login"]'))location.href='index.html?v=revision96';};return;}owner=data.user.id;globalThis.LudusNavigation?.setOwner(owner);const restored=globalThis.LudusNavigation?.restore();if(restored){view=restored.view||view;pages=restored.pages||{};vaultTab=restored.vaultTab||vaultTab;}await load();if(pending())await mutate(null,null,true);client.rpc('ludus_social',{p_action:'ping'}).then(()=>{}).catch(()=>{});setInterval(()=>{if(!document.hidden&&!busy&&!document.querySelector('#screen input:focus,#screen select:focus')&&['home','trophies'].includes(view))load(true);if(!document.hidden)client.rpc('ludus_social',{p_action:'ping'}).then(()=>{}).catch(()=>{});},20000);}catch(e){msg(e.message,true);$('retry').hidden=false;}})();
})();
</script>
</body></html>
