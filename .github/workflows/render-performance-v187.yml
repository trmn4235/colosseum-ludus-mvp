name: Full scene performance budgets
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-budgets:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    env:
      LUDUS_RENDER_SCALE_TEST: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Exact animation poses, bounded armour and elapsed time
        run: node tests/render-runtime-v187.cjs
      - name: Existing pose scheduling and body detail regressions
        run: node --test tests/arena-timing-v94.test.cjs tests/naval-performance-v106.test.cjs tests/adaptive-quality-v96.test.cjs tests/render-scale-v188.test.cjs
      - run: npm install --no-save --no-package-lock playwright@1.64.1 @electric-sql/pglite@0.5.10
      - name: Twenty gladiators, full shadows and low-FPS clock
        env:
          LUDUS_PERFORMANCE_TEST: '1'
        run: node tests/arena-browser-v96.cjs
      - name: Full 5v6 caravan, replay, pause and 10–120 FPS clock
        run: node tests/caravan-performance-v187.cjs
      - name: Eight horses and eight crew, live shadows and clock
        run: node tests/circus-performance-v187.cjs
      - name: Selected ranked fighters, equipment and party authorization
        run: |
          node scripts/build-ranked-runtime-v253.cjs --check
          node tests/ranked-party-v244.cjs
          node tests/ranked-bots-v249.cjs
          node tests/ranked-ui-v244.cjs
          node tests/ranked-lineup-v253.cjs
      - name: Save ranked lineup browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ranked-lineup-v253
          path: /tmp/ranked-v253
          if-no-files-found: ignore
