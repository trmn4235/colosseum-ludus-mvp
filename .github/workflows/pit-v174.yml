name: Pit courtyard and exhibition
on:
  push:
    branches: [main, codex/pit-realism-v174, codex/pit-v175]
    paths: ['pit-*', 'san-avlusu.html', 'assets/pit-v174/**', 'assets/pit-v175/**', 'assets/pit-v176/**', 'assets/pit-v177/**', 'assets/pit-v178/**', 'combat-pointer-v177.js', 'arena.html', 'arena-results-v83.js', 'supabase/migrations/*pit*', 'tests/pit-*', '.github/workflows/pit-v174.yml']
  pull_request:
    paths: ['pit-*', 'san-avlusu.html', 'assets/pit-v174/**', 'assets/pit-v175/**', 'assets/pit-v176/**', 'assets/pit-v177/**', 'assets/pit-v178/**', 'combat-pointer-v177.js', 'arena.html', 'arena-results-v83.js', 'supabase/migrations/*pit*', 'tests/pit-*', '.github/workflows/pit-v174.yml']
permissions:
  contents: read
jobs:
  pit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1 @electric-sql/pglite@0.5.11
      - run: node tests/pit-model-v172.cjs && node tests/pit-exhibition-v174.cjs
      - run: node tests/pit-round-v176.cjs
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node tests/pit-people-v175.cjs && node tests/pit-gallery-v175.cjs
      - run: node tests/pit-browser-v172.cjs && node tests/pit-combat-browser-v172.cjs
      - run: node tests/pit-controls-v177.cjs && node tests/pit-archery-v178.cjs
      - run: node tests/pit-browser-v176.cjs
