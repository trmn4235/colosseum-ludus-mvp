name: Throw release V218
on:
  push:
    branches: [main, codex/character-throw-v218]
    paths: ['arena-anatomy-v166.js', 'arena.html', 'savas.html', 'multiplayer.html', 'caravan-battle-v126.js', 'caravan-core-v126.js', 'caravan-rig-v126.js', 'pit-visit-v172.js', 'tests/character-*-v218.cjs', 'tests/arena-browser-v96.cjs', '.github/workflows/character-v218.yml']
  pull_request:
    branches: [main]
    paths: ['arena-anatomy-v166.js', 'arena.html', 'savas.html', 'multiplayer.html', 'caravan-battle-v126.js', 'caravan-core-v126.js', 'caravan-rig-v126.js', 'pit-visit-v172.js', 'tests/character-*-v218.cjs', 'tests/arena-browser-v96.cjs', '.github/workflows/character-v218.yml']
permissions:
  contents: read
jobs:
  character:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Actual projectile lifecycle and display scheduling
        run: |
          node tests/character-throw-v218.cjs
          node tests/character-throw-integration-v218.cjs
          node tests/character-classes-v215.cjs
          node tests/character-actions-v215.cjs
          node tests/character-asset-v217.cjs
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9fc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --shm-size=1g
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.64.1 sharp@0.34.3
      - name: Textured throw and exact release frame
        env:
          LUDUS_V218_TEST: '1'
          LUDUS_V218_ONLY: '1'
          LUDUS_TEST_ENGINE: ${{ matrix.engine }}
          LUDUS_TEST_OUTPUT: /tmp/v218
        run: node tests/arena-browser-v96.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-v218-${{ matrix.engine }}
          path: /tmp/v218
          if-no-files-found: ignore
