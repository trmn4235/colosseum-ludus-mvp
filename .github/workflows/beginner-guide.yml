name: Beginner guide regression
on:
  push:
    branches: [codex/beginner-guide-v109]
  pull_request:
    branches: [main]
    paths: ['ludus-onboarding-*', 'tests/onboarding-*', 'ludus.html', 'gladiator-exercise-v46.js', 'imperial-missions-v31.js']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check ludus-onboarding-v109.js
          node --check gladiator-exercise-v46.js
          node --check imperial-missions-v31.js
      - name: Install isolated browser tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: First-player flow and mobile layouts
        run: node tests/onboarding-v109.cjs
