name: Beginner guide regression
on:
  push:
    branches: [codex/beginner-guide-v109]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guide:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check ludus-onboarding-v109.js
          node --check gladiator-exercise-v46.js
          node --check imperial-missions-v31.js
      - name: Install isolated browser tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
      - name: First-player flow and mobile layouts
        run: node tests/onboarding-v109.cjs
