name: Stable husbandry and trade
on:
  push:
    branches: [main]
    paths: ['ludus-stable-*', 'ludus.html', 'ludus-door-icons-v41.js', 'assets/stable-v129/**', 'assets/stable-v130/**', 'assets/stable-v131/**', 'tests/stable-*.cjs', 'supabase/migrations/*stable*', '.github/workflows/stable.yml']
  pull_request:
    paths: ['ludus-stable-*', 'ludus.html', 'ludus-door-icons-v41.js', 'assets/stable-v129/**', 'assets/stable-v130/**', 'assets/stable-v131/**', 'tests/stable-*.cjs', 'supabase/migrations/*stable*', '.github/workflows/stable.yml']
permissions:
  contents: read
jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock @electric-sql/pglite@0.5.10 jsdom@26.1.0 three@0.160.0
      - name: Persistent game rules and transactions
        run: STABLE_FIXTURE_PATH=/tmp/stable-v129.json node tests/stable-v129.cjs
      - name: UI interactions and cached room models
        run: STABLE_FIXTURE_PATH=/tmp/stable-v129.json node tests/stable-ui-v129.cjs
      - name: Actual GLB scale, herd and aisle geometry
        run: node tests/stable-models-v130.cjs
      - name: JavaScript syntax
        run: |
          node --check ludus-stable-v129.js
          node --check ludus-stable-environment-v131.js
          node --check ludus-stable-room-v130.js
          node --check ludus-stable-appearance-v130.js
          node --check ludus-door-icons-v41.js
