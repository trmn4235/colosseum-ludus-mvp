name: Imperial rankings
on:
  push:
    branches: [main]
    paths: ['siralamalar.html', '*rank*v200*', '*rank*v201*', '*rank*v203*', '*rank*v204*', 'roman-ui-v56.css', 'roman-theme-v68.css', 'game-art-v136.css', 'supabase/migrations/*imperial_rankings*', 'supabase/functions/caravan-combat-v126/career-combat-v162.js', 'tests/rankings*', '.github/workflows/rankings-v200.yml']
  pull_request:
    paths: ['siralamalar.html', '*rank*v200*', '*rank*v201*', '*rank*v203*', '*rank*v204*', 'roman-ui-v56.css', 'roman-theme-v68.css', 'game-art-v136.css', 'supabase/migrations/*imperial_rankings*', 'supabase/functions/caravan-combat-v126/career-combat-v162.js', 'tests/rankings*', '.github/workflows/rankings-v200.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rankings:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1 @electric-sql/pglite@0.5.10
      - run: npx playwright install --with-deps chromium webkit
      - name: Ranking formulas, immutable results and access controls
        run: |
          node tests/rankings-v200.cjs
          node tests/rankings-v203.cjs
          node tests/rankings-telemetry-v200.cjs
          node tests/career-combat-v162.cjs
          node tests/careers-v162.cjs
      - name: Chromium touch layouts and interactions
        run: node tests/rankings-browser-v203.cjs
      - name: WebKit touch layouts and interactions
        run: LUDUS_WEBKIT_TEST=1 LUDUS_TEST_OUTPUT=/tmp/rankings-webkit-v203 node tests/rankings-browser-v203.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imperial-rankings-screens
          path: /tmp/rankings*-v203/*.png
          retention-days: 7
