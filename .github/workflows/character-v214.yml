name: Character guard and retopo V214
on:
  push:
    branches: [codex/character-guard-v214]
    paths: ['arena.html', 'savas.html', 'multiplayer.html', 'caravan-rig-v126.js', 'arena-authored-motion-v163.js', 'arena-anatomy-v166.js', 'gladiator-mobile-v214.glb', 'tests/character-*-v214.*', 'tests/arena-browser-v96.cjs', 'tools/retopo-character-v214.cjs', '.github/workflows/character-v214.yml']
  workflow_call:
permissions:
  contents: read
jobs:
  character:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --shm-size=1g
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.64.1 sharp@0.34.3
      - name: Guard, poses and asset integrity
        run: |
          node tests/character-asset-v214.cjs
          node tests/character-guard-v214.cjs
          node tests/character-pose-v214.cjs
          node tests/character-integration-v214.cjs
          node tests/character-motion-v213.cjs
          node tests/anatomy-v166.cjs
          node tests/motion-stability-v165.cjs
          node tests/combat-motion-replay-v163.cjs
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --shm-size=1g
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.64.1 sharp@0.34.3
      - name: Real model and pose comparison
        env:
          LUDUS_V214_TEST: '1'
          LUDUS_V214_ONLY: '1'
          LUDUS_TEST_ENGINE: ${{ matrix.engine }}
          LUDUS_TEST_OUTPUT: /tmp/v214
        run: node tests/arena-browser-v96.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-v214-${{ matrix.engine }}
          path: /tmp/v214
          if-no-files-found: ignore
