name: Clothing geometry V217
on:
  push:
    branches: [main, codex/character-clothing-v217]
    paths: ['gladiator-mobile-v217.glb', 'assets/naval/gladiator-lod-v217.*', 'arena.html', 'savas.html', 'multiplayer.html', 'ludus.html', 'caravan-rig-v126.js', 'circus-war-view-v186.js', 'naval-performance-v106.js', 'tests/character-*-v217.*', 'tests/arena-browser-v96.cjs', 'tools/*-v217.cjs', '.github/workflows/character-v217.yml']
  workflow_call:
permissions:
  contents: read
jobs:
  character:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Asset, posed surfaces, contacts and compatible detail levels
        run: |
          node tests/character-asset-v217.cjs
          node tests/character-surface-v217.cjs
          node tests/character-classes-v215.cjs
          node tests/character-grip-v215.cjs
          node tests/character-actions-v215.cjs
          node tests/character-normals-v216.cjs
          node tests/naval-performance-v106.test.cjs
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --shm-size=1g
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.64.1 sharp@0.34.3
      - name: Seven-class textured baseline comparison
        env:
          LUDUS_V217_TEST: '1'
          LUDUS_V217_ONLY: '1'
          LUDUS_TEST_ENGINE: ${{ matrix.engine }}
          LUDUS_TEST_OUTPUT: /tmp/v217
        run: node tests/arena-browser-v96.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-v217-${{ matrix.engine }}
          path: /tmp/v217
          if-no-files-found: ignore
