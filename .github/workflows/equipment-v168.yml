name: Equipment categories and shield breaking
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  equipment:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --shm-size=1g
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @electric-sql/pglite@0.5.10 playwright@1.64.1 sharp@0.34.3
      - run: |
          node --test tests/item-identity-v199.cjs tests/shields-v198.cjs tests/arm-equipment-fit-v197.cjs tests/arm-equipment-v196.cjs tests/helmet-budget-v195.cjs tests/helmet-identity-v194.cjs tests/halberd-v193.cjs tests/equipment-budget-v191.cjs tests/classic-equipment-v190.cjs tests/helmets-v189.cjs tests/helmet-v169.cjs tests/equipment-groups-v168.cjs tests/equipment-catalog-v167.cjs tests/equipment-arena-v30.test.cjs tests/forum-market-v66.test.cjs
          node tests/equipment-sql-v168.cjs
          node tests/halberd-sql-v193.cjs
          node tests/arm-equipment-sql-v196.cjs
          node tests/shields-sql-v198.cjs
          LUDUS_HALBERD_TEST=1 node tests/gladiator-equipment-v49.cjs
          node tests/combat-motion-replay-v163.cjs
          node tests/account-loading-v171.cjs
          node tests/pit-model-v172.cjs
          node tests/pit-sql-v172.cjs
          node tests/pit-sql-v173.cjs
          LUDUS_EQUIPMENT_TEST=1 node tests/production-v119.cjs
      - name: Exact item identity and chest appearance
        run: |
          node tests/item-identity-browser-v199.cjs
          node tests/item-picker-v199.cjs
      - name: Selected shield models in Chromium and WebKit
        run: |
          node scripts/render-shields-v198.cjs
          LUDUS_WEBKIT_TEST=1 LUDUS_TEST_OUTPUT=/tmp/shield-renders-webkit node scripts/render-shields-v198.cjs
      - name: Selected shield equipment and production on touch screens
        timeout-minutes: 5
        run: |
          node tests/shields-browser-v198.cjs
          LUDUS_WEBKIT_TEST=1 LUDUS_TEST_OUTPUT=/tmp/shields-v198-webkit node tests/shields-browser-v198.cjs
      - run: |
          node tests/arm-equipment-courtyard-v197.cjs
          LUDUS_WEBKIT_TEST=1 node tests/arm-equipment-courtyard-v197.cjs
          node scripts/render-armour-v196.cjs
          LUDUS_WEBKIT_TEST=1 LUDUS_TEST_OUTPUT=/tmp/armour-v196-webkit node scripts/render-armour-v196.cjs
          node tests/arm-equipment-production-browser-v196.cjs
          node tests/helmet-budget-browser-v195.cjs
          LUDUS_WEBKIT_TEST=1 node tests/helmet-budget-browser-v195.cjs
          node tests/helmet-identity-browser-v194.cjs
          LUDUS_WEBKIT_TEST=1 node tests/helmet-identity-browser-v194.cjs
          node tests/halberd-production-browser-v193.cjs
          node tests/halberd-browser-v193.cjs
          LUDUS_WEBKIT_TEST=1 node tests/halberd-browser-v193.cjs
          node tests/equipment-browser-v168.cjs
          node tests/equipment-production-browser-v168.cjs
          node tests/helmet-production-browser-v169.cjs
          node tests/helmets-render-v189.cjs
          LUDUS_WEBKIT_TEST=1 node tests/helmets-render-v189.cjs
          node tests/equipment-render-v191.cjs
          LUDUS_WEBKIT_TEST=1 node tests/equipment-render-v191.cjs
          node tests/classic-equipment-render-v190.cjs
          LUDUS_WEBKIT_TEST=1 node tests/classic-equipment-render-v190.cjs
          node tests/loading-recovery-v171.cjs
          node tests/rome-travel-v148.cjs
          node tests/pit-browser-v172.cjs
          node tests/pit-combat-browser-v172.cjs
