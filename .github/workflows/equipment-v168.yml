name: Equipment categories and shield breaking
on:
  push:
    branches: [main]
    paths: ['equipment-*', 'assets/equipment-v189/**', 'assets/items-v189/**', 'ludus-production-v119.js', 'tests/helmet*', 'supabase/migrations/*lightweight_helmets*', '.github/workflows/equipment-v168.yml']
  pull_request:
    branches: [main]
    paths: ['assets/equipment-v189/**', 'assets/items-v189/**', 'supabase/migrations/*lightweight_helmets*', 'pit-*', 'san-avlusu.html', 'tests/pit-*', 'supabase/migrations/*pit*', 'rome-*', 'tests/loading-recovery-*', 'tests/account-loading-*', 'equipment-*', 'assets/items-v168/**', 'assets/items-v169/**', 'ludus.html', 'ludus-production-v119.js', 'tests/helmet-*', 'supabase/migrations/*sylvain_helmet*', 'ludus-supply-v85.js', 'market-v56.js', 'forum-market-v66.js', 'arena.html', 'savas.html', 'multiplayer.html', 'caravan-*', 'tests/equipment-*', 'supabase/migrations/*equipment_groups*', '.github/workflows/equipment-v168.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  equipment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @electric-sql/pglite@0.5.10 playwright@1.64.1
      - run: |
          node --test tests/helmets-v189.cjs tests/helmet-v169.cjs tests/equipment-groups-v168.cjs tests/equipment-catalog-v167.cjs tests/equipment-arena-v30.test.cjs tests/forum-market-v66.test.cjs
          node tests/equipment-sql-v168.cjs
          node tests/combat-motion-replay-v163.cjs
          node tests/account-loading-v171.cjs
          node tests/pit-model-v172.cjs
          node tests/pit-sql-v172.cjs
          node tests/pit-sql-v173.cjs
          LUDUS_EQUIPMENT_TEST=1 node tests/production-v119.cjs
      - run: npx playwright install --with-deps chromium webkit
      - run: |
          node tests/equipment-browser-v168.cjs
          node tests/equipment-production-browser-v168.cjs
          node tests/helmet-production-browser-v169.cjs
          node tests/helmets-render-v189.cjs
          LUDUS_WEBKIT_TEST=1 node tests/helmets-render-v189.cjs
          node tests/loading-recovery-v171.cjs
          node tests/rome-travel-v148.cjs
          node tests/pit-browser-v172.cjs
          node tests/pit-combat-browser-v172.cjs
