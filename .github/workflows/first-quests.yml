name: First quests regression
on:
  push:
    branches: [codex/first-quests-v111]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staff-safari:
    # Native WebKit gives the closest Safari coverage. Linux WebKit r2370
    # stalls animation callbacks on backdrop-filter layers (playwright#43426).
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.65.1
      - name: Install native WebKit
        run: npx playwright install webkit
      - name: Six actual staff models and phone profiles in Safari
        env:
          LUDUS_WEBKIT_TEST: '1'
          LUDUS_TEST_OUTPUT: /tmp/staff-v284-webkit
        run: node tests/special-staff-ui-v284.cjs
      - name: Papyrus reward report and profile layouts in Safari
        env:
          LUDUS_WEBKIT_TEST: '1'
          LUDUS_TEST_OUTPUT: /tmp/staff-v284-webkit/loot-v285
        run: node tests/special-staff-loot-ui-v285.cjs
      - name: Approved staff home and papyrus layouts in Safari
        env:
          LUDUS_WEBKIT_TEST: '1'
          LUDUS_TEST_OUTPUT: /tmp/staff-v284-webkit/papyrus-v288
        run: node tests/special-staff-ui-v288.cjs
      - name: V289 infirmary and medical production layouts in Safari
        env:
          LUDUS_WEBKIT_TEST: '1'
          LUDUS_TEST_OUTPUT: /tmp/staff-v284-webkit/infirmary-v289
        run: |
          medical_test_status=0
          node tests/infirmary-ui-v289.cjs || medical_test_status=1
          node tests/infirmary-supplies-ui-v289.cjs || medical_test_status=1
          exit "$medical_test_status"
      - name: Upload Safari staff screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staff-v284-webkit
          path: /tmp/staff-v284-webkit
          if-no-files-found: ignore
  first-quests:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 12
    env:
      LUDUS_TEST_OUTPUT: /tmp/combat-values-v110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated test tools
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1 @electric-sql/pglite@0.5.10
      - name: Shared caravan owner contributions and mobile layouts
        env:
          LUDUS_TEST_OUTPUT: /tmp/caravans-v268
        run: node tests/clan-caravans-browser-v268.cjs
      - name: Shared caravans in Safari
        env:
          LUDUS_WEBKIT_TEST: '1'
          LUDUS_TEST_OUTPUT: /tmp/caravans-v268
        run: node tests/clan-caravans-browser-v268.cjs
      - name: Upload shared caravan screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: caravans-v268
          overwrite: true
          path: /tmp/caravans-v268
          if-no-files-found: ignore
      - name: Server milestones and account isolation
        run: node tests/first-quests-v111.cjs
      - name: Combat contribution regression
        run: node tests/combat-values-v110.cjs
      - name: Full courtyard, mobile guide and Settings Help
        env:
          LUDUS_COMBAT_VALUES_TEST: '1'
        run: node tests/first-quests-ui-v111.cjs
      - name: Daily kitchen database and retry regression
        run: node tests/daily-kitchen-v265.cjs
      - name: Papyrus drops, match receipts and unique supply
        run: node tests/special-staff-loot-v285.cjs
      - name: Papyrus reward report and profile layouts
        env:
          LUDUS_TEST_OUTPUT: /tmp/kitchen-v265/loot-v285
        run: node tests/special-staff-loot-ui-v285.cjs
      - name: V288 catalogue, inventory, learning and server effects
        run: |
          node tests/papyrus-catalog-v288.cjs
          node tests/smith-effects-v288.cjs
          node tests/smith-preview-v288.cjs
          node tests/special-staff-care-v288.cjs
          node tests/staff-care-sql-v288.cjs
          node tests/staff-care-combat-v288.cjs
          node tests/staff-combat-v288.cjs
          node tests/staff-combat-snapshot-v288.cjs
          node tests/special-staff-contract-v288.cjs
      - name: V289 medical supplies, injury treatment and owner isolation
        run: |
          node tests/infirmary-inputs-v289.cjs
          node tests/infirmary-supplies-v289.cjs
          node tests/infirmary-contract-v289.cjs
          node tests/infirmary-v289.cjs
          node tests/injury-events-v289.cjs
          node tests/injury-events-sql-v289.cjs
      - name: V289 infirmary and medical production layouts
        env:
          LUDUS_TEST_OUTPUT: /tmp/kitchen-v265/infirmary-v289
        run: |
          medical_test_status=0
          node tests/infirmary-ui-v289.cjs || medical_test_status=1
          node tests/infirmary-supplies-ui-v289.cjs || medical_test_status=1
          exit "$medical_test_status"
      - name: Approved staff home and papyrus layouts
        env:
          LUDUS_TEST_OUTPUT: /tmp/kitchen-v265/papyrus-v288
        run: node tests/special-staff-ui-v288.cjs
      - name: Papyrus learning and all-worker kitchen accounting
        run: node tests/special-staff-v284.cjs
      - name: Special staff models, profiles and mobile layouts
        env:
          LUDUS_TEST_OUTPUT: /tmp/kitchen-v265/staff
        run: node tests/special-staff-ui-v284.cjs
      - name: Daily kitchen full Ludus and mobile layouts
        env:
          LUDUS_TEST_OUTPUT: /tmp/kitchen-v265
        run: node tests/daily-kitchen-ui-v265.cjs
      - name: Upload daily kitchen screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kitchen-v265
          path: /tmp/kitchen-v265
          if-no-files-found: ignore
