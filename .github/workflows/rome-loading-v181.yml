name: Rome map and photographic loading
on:
  push:
    branches: [main]
    paths: ['rome-*', 'roma.html', 'ludus.html', 'san-avlusu.html', 'circus-maximus.html', 'savas.html', 'arena.html', 'caravan-field.html', 'index.html', 'multiplayer.html', 'assets/rome-v181/**', 'assets/loading-v181/**', 'scripts/build-loading-art-v*.cjs', 'tests/loading-art-v181.cjs', 'tests/rome-travel-v148.cjs', '.github/workflows/rome-loading-v181.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  travel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node tests/rome-travel-v148.cjs
      - run: node tests/loading-art-v181.cjs
      - run: node tests/loading-recovery-v171.cjs
