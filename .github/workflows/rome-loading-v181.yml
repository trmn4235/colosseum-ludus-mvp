name: Rome map and photographic loading
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  travel:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --shm-size=1g
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.64.1
      - run: node tests/rome-travel-v148.cjs
      - run: node tests/loading-art-v181.cjs
      - run: node tests/loading-recovery-v171.cjs
