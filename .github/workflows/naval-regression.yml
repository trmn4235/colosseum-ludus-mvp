name: Naval regression
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Simulation and combat regressions
        run: node --test tests/naval-v97.test.cjs tests/naval-v102.test.cjs tests/naval-boat-v98.test.cjs tests/naval-jump-v99.test.cjs tests/naval-javelin-v100.test.cjs tests/naval-team-rope-v104.test.cjs tests/combat-feel-v23.test.cjs tests/polearm-v105.test.cjs tests/naval-performance-v106.test.cjs
      - name: Install isolated browser tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
      - name: Browser gameplay and mobile layouts
        env:
          LUDUS_TEST_OUTPUT: /tmp/naval-regression
        run: node tests/naval-browser-v97.cjs
