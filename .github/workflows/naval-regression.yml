name: Naval regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'arena*'
      - 'naval-*'
      - 'savas.html'
      - 'tests/naval-*'
      - '.github/workflows/naval-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Simulation and combat regressions
        run: node --test tests/naval-v97.test.cjs tests/naval-boat-v98.test.cjs tests/naval-jump-v99.test.cjs tests/naval-javelin-v100.test.cjs tests/combat-feel-v23.test.cjs
      - name: Install isolated browser tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Browser gameplay and mobile layouts
        env:
          LUDUS_TEST_OUTPUT: /tmp/naval-regression
        run: node tests/naval-browser-v97.cjs
