name: Caravan forest field
on:
  push:
    branches: [main]
    paths: ['caravan-*', 'assets/caravan-field-v125/**', 'assets/caravan-v128/**', 'tests/caravan-*.cjs', 'supabase/functions/caravan-combat-v126/**', 'supabase/migrations/*caravan_combat*', 'supabase/migrations/*caravan_arena*', 'supabase/migrations/*caravan_messages*', '.github/workflows/caravan-field.yml']
  pull_request:
    paths: ['caravan-*', 'assets/caravan-field-v125/**', 'assets/caravan-v128/**', 'tests/caravan-*.cjs', 'supabase/functions/caravan-combat-v126/**', 'supabase/migrations/*caravan_combat*', 'supabase/migrations/*caravan_arena*', 'supabase/migrations/*caravan_messages*', '.github/workflows/caravan-field.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock playwright@1.64.1 @electric-sql/pglite@0.5.10
      - run: npx playwright install --with-deps chromium
      - run: node tests/caravan-field-v125.cjs
      - name: Battle and escort database fixtures
        run: LUDUS_CARAVAN_COMBAT_TEST=1 node tests/production-v119.cjs
      - name: Arena pickup, regional controls and compatible replays
        run: node tests/caravan-arena-v127.cjs
      - name: Shared verifier and authenticated result contract
        run: node tests/caravan-verifier-v126.cjs
      - name: Battle controls, shared rigs and verified replay
        run: LUDUS_CARAVAN_ARENA_TEST=1 LUDUS_FAST_BATTLE_TEST=1 node tests/caravan-combat-v126.cjs
      - name: Cargo notifications and delivered amounts
        run: node tests/caravan-messages-v128.cjs
      - name: Loading, net capture, horse reaction and clothed driver
        run: node tests/caravan-presentation-v128.cjs
