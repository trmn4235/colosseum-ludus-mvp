name: Caravan forest field
on:
  push:
    branches: [main]
    paths: ['caravan-field*', 'assets/caravan-field-v125/**', 'tests/caravan-field-v125.cjs', '.github/workflows/caravan-field.yml']
  pull_request:
    paths: ['caravan-field*', 'assets/caravan-field-v125/**', 'tests/caravan-field-v125.cjs', '.github/workflows/caravan-field.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/caravan-field-v125.cjs
