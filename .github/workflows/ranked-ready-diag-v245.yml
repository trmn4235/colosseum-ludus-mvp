name: Ranked preparation diagnostic
on:
  push:
    branches: [codex/ranked-ready-diag-v245]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock playwright@1.64.1 @electric-sql/pglite@0.5.10
      - run: node tests/ranked-party-v244.cjs
      - run: node tests/ranked-ui-v244.cjs
