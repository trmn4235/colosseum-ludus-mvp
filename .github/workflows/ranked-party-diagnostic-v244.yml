name: Ranked party diagnostic
on:
  push:
    branches: ['codex/ranked-party-diagnostic-v244']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test party and authorization
        run: |
          npm install --no-save --no-package-lock @electric-sql/pglite@0.5.10
          node tests/ranked-party-v244.cjs
