name: Ranked party diagnostic
on:
  push:
    branches: ['codex/ranked-party-diagnostic-v244']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --shm-size=1g
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated tests
        run: npm install --no-save --no-package-lock @electric-sql/pglite@0.5.10 playwright@1.64.1
      - name: Ranked team rules and layouts
        run: node tests/arena-tabs-v81.cjs
      - name: Prepare real caravan defense fixture
        run: |
          node tests/caravan-collection-v116.cjs
          LUDUS_CARAVAN_COMBAT_TEST=1 node tests/production-v119.cjs
          node tests/caravan-defense-v230.cjs
      - name: Test actual caravan defense pages
        run: node tests/caravan-defense-browser-v230.cjs
