name: Character motion V213
on:
  push:
    branches: [main, codex/character-motion-v213]
    paths: ['arena-locomotion-v91.js', 'arena-anatomy-v166.js', 'arena-authored-motion-v163.js', 'gladiator-mobile-v213.glb', 'tests/character-*-v213.cjs', 'tests/arena-browser-v96.cjs', '.github/workflows/character-v213.yml']
  workflow_call:
permissions:
  contents: read
jobs:
  character:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --shm-size=1g
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.64.1 sharp@0.34.3
      - name: Real rig, contacts and asset integrity
        run: |
          node tests/character-motion-v213.cjs
          node tests/character-asset-v213.cjs
          node tests/anatomy-v166.cjs
          node tests/motion-stability-v165.cjs
          node tests/combat-motion-replay-v163.cjs
          node tests/locomotion-data-v91.cjs
      - name: Chromium character and grip rendering
        env:
          LUDUS_CHARACTER_TEST: '1'
          LUDUS_FIT_TEST: '1'
          LUDUS_FIT_ONLY: '1'
        run: node tests/arena-browser-v96.cjs
      - name: WebKit character and grip rendering
        env:
          LUDUS_CHARACTER_TEST: '1'
          LUDUS_FIT_TEST: '1'
          LUDUS_FIT_ONLY: '1'
          LUDUS_TEST_ENGINE: webkit
        run: node tests/arena-browser-v96.cjs
