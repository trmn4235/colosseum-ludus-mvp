name: Bot names diagnostic
on:
  push:
    branches: ['codex/bot-names-diag-v245']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @electric-sql/pglite@0.5.10
      - run: node -e "require('./tests/bot-simulation-v233.cjs');require('./tests/bot-database-v233.cjs')().catch(e=>{console.error(e);process.exit(1)})"
