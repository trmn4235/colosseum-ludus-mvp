name: Roman art direction
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-layouts:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated browser and database tools
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1 @electric-sql/pglite@0.5.10
      - name: Unit regressions
        run: node --test tests/*.test.cjs
      - name: Check shipped art, font and every active entry page
        run: node tests/art-assets-v136.cjs
      - name: Full-screen loaders and continuous caravan settlement
        run: node tests/loading-transitions-v140.cjs
      - id: fixtures
        name: Generate isolated room fixtures
        run: |
          LUDUS_MARKET_HISTORY_TEST=1 node tests/production-v119.cjs
          node tests/caravan-collection-v116.cjs
          STABLE_FIXTURE_PATH=/tmp/stable-fixture-v136.json node tests/stable-v129.cjs
      - name: Six page sizes, level summary, clan views and expanded pause guide
        run: node tests/art-pages-v136.cjs
      - name: Clan power totals and mobile layout
        run: |
          node tests/clan-power-logic-v231.cjs
          node tests/clan-power-v231.cjs
      - name: Open-air stable, groom interaction and room restoration
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        run: node tests/stable-yard-v139.cjs
      - name: Courtyard and all room tabs including active horse duel
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        run: node tests/art-rooms-v136.cjs
      - name: Character tabs, mission details, empty states and friend requests
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        run: node tests/art-details-v137.cjs
      - name: Message contents, long-text paging and safe retry
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        run: node tests/messages-v108.cjs
      - name: Login, registration and cinematic recovery
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        run: node tests/login-intro-v40.cjs
      - name: Stalled entry artwork recovery in Chromium and WebKit
        run: |
          node tests/login-intro-recovery-v223.cjs
          LUDUS_WEBKIT_TEST=1 node tests/login-intro-recovery-v223.cjs
      - name: Arena cards and marketplace selection
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        run: |
          node tests/arena-tabs-v81.cjs
          node tests/forum-market-layout-v67.cjs
