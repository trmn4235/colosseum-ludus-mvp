name: Circus war chariots
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  race:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.64.1
      - name: Seven laps, bot roles, collision and horse immunity
        run: node tests/circus-combat-v183.cjs
      - name: Nearby opponents, leader handoff and physical pursuit
        run: node tests/circus-war-pack-v185.cjs
      - name: Two gladiators, two horses, controls and mobile frames
        run: node tests/circus-war-browser-v183.cjs
      - name: Preserve clerk, betting and ordinary race registration
        run: node tests/circus-dialogue-v152.cjs
      - name: Preserve five-lap manual race
        run: node tests/circus-driving-v183.cjs
