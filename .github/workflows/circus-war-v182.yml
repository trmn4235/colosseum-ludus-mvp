name: Circus war chariots
on:
  push:
    branches: [main]
    paths: ['circus-*', 'tests/circus-war-*', 'tests/circus-dialogue-v152.cjs', 'tests/circus-driving-v158.cjs', '.github/workflows/circus-war-v182.yml']
  pull_request:
    paths: ['circus-*', 'tests/circus-war-*', 'tests/circus-dialogue-v152.cjs', 'tests/circus-driving-v158.cjs', '.github/workflows/circus-war-v182.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Seven laps, bot roles, collision and horse immunity
        run: node tests/circus-war-v182.cjs
      - name: Two gladiators, two horses, controls and mobile frames
        run: node tests/circus-war-browser-v182.cjs
      - name: Preserve clerk, betting and ordinary race registration
        run: node tests/circus-dialogue-v152.cjs
      - name: Preserve five-lap manual race
        run: node tests/circus-driving-v158.cjs
