name: Ranked team preparation
on:
  pull_request:
    paths:
      - 'ranked-*-v244.*'
      - 'supabase/migrations/*_ranked_party_v244.sql'
      - 'tests/ranked-*-v244.cjs'
      - 'tests/arena-tabs-v81.cjs'
      - '.github/workflows/ranked-team-v244.yml'
  push:
    branches: [main]
    paths:
      - 'ranked-*-v244.*'
      - 'supabase/migrations/*_ranked_party_v244.sql'
      - 'tests/ranked-*-v244.cjs'
      - 'tests/arena-tabs-v81.cjs'
      - '.github/workflows/ranked-team-v244.yml'
permissions:
  contents: read
jobs:
  ranked-team:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install test tools
        run: npm install --no-save --no-package-lock @electric-sql/pglite@0.5.10 playwright@1.64.1
      - name: Test party authorization and notifications
        run: |
          node tests/ranked-party-v244.cjs
          node tests/ranked-loader-v244.cjs
          node tests/ranked-notice-v244.cjs
      - name: Install browser
        run: npx playwright install --only-shell chromium
      - name: Test team preparation and arena navigation
        run: |
          node tests/ranked-ui-v244.cjs
          node tests/arena-tabs-v81.cjs
