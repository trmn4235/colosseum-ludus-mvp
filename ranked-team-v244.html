<!doctype html>
<html lang="tr">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#46141d">
 <title>Ranked Arena · Takım Hazırlığı</title>
 <link rel="stylesheet" href="ranked-team-v244.css?v=244">
</head>
<body>
 <main class="ranked-page">
  <header class="ranked-header">
   <a class="back" href="savas.html" aria-label="Savaş seçimine dön">‹</a>
   <h1>RANKED ARENA</h1>
   <span class="header-caption">TAKIM HAZIRLIĞI</span>
  </header>
  <div class="ranked-layout">
   <aside class="paper invite-panel" aria-labelledby="invite-title">
    <header><small>TAKIM ARKADAŞLARIN</small><h2 id="invite-title">Davet Listesi</h2></header>
    <div class="invite-tabs" role="group" aria-label="Davet listesi">
     <button id="friendsTab" class="selected" type="button">Arkadaşlar</button>
     <button id="clanTab" type="button">Klan</button>
    </div>
    <div id="candidateList" class="candidate-list" aria-live="polite"></div>
    <nav class="pager" aria-label="Davet listesi sayfaları"><button id="previous" type="button" aria-label="Önceki sayfa">‹</button><span id="pageNumber">1 / 1</span><button id="next" type="button" aria-label="Sonraki sayfa">›</button></nav>
   </aside>
   <section class="team-scene" aria-label="Beş kişilik takım">
    <div id="teamSlots" class="team-slots"></div>
    <span class="art-caption">Karakter görselleri temsilidir</span>
   </section>
   <aside class="paper ready-panel" aria-labelledby="ready-title">
    <header><small>ARENAYA HAZIRLAN</small><h2 id="ready-title">Maç Hazırlığı</h2></header>
    <div class="crossed" aria-hidden="true">⚔</div>
    <div class="stats"><div><span>Başlangıç puanı</span><strong>1500</strong></div><div><span>Başlangıç kademesi</span><strong>Gümüş V</strong></div><div><span>Takım</span><strong id="teamCount">0 / 5</strong></div><div><span>Galibiyet / Mağlubiyet</span><strong>+10 / −5</strong></div></div>
    <label class="fighter-label" for="fighterSelect">Gladyatörün</label><select id="fighterSelect" aria-label="Gladyatörünü seç"></select>
    <div id="incoming" class="incoming" hidden></div>
    <button id="createTeam" type="button" class="primary">TAKIM KUR</button>
    <button id="leaveTeam" type="button" class="secondary" hidden>Takımdan ayrıl</button>
    <button type="button" class="primary match" disabled>MAÇA GİR · YAKINDA</button>
    <p id="status" class="status" role="status">Takım bilgileri yükleniyor…</p>
   </aside>
  </div>
 </main>
 <script src="assets/runtime/supabase-59d39487c358.js"></script>
 <script src="ludus-client-v84.js?v=revision84"></script>
 <script src="ranked-team-v244.js?v=244"></script>
</body>
</html>
